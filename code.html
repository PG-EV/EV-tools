<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reusable JavaScript tools and code snippets.">
  <title>Code Library</title>
  <style>

<body>
  <main class="page">
    <header class="topbar">
      <div><div class="eyebrow">Reusable Tools</div><h1>Code Library</h1><p class="subtitle">Click a row to view, edit, and copy its code.</p></div>
      <a class="back" href="index.html">← Dashboard</a>
    </header>
    <section class="library" aria-label="Code snippets">
      <div class="library-head"><span>Name</span><span>Description</span><span></span></div>
      <div class="code-row-wrap">
        <button class="code-row" id="open-extract-h1" type="button" data-source="extract-h1-source" data-title="Extract &lt;H1&gt;">
          <span class="code-name">Extract &lt;H1&gt;</span>
          <span class="code-description">Extract page titles and H1 headings from any list of URLs, with worker controls, progress, copy, and CSV download.</span>
          <span class="row-end">
            <span class="message-icon info-icon" role="button" tabindex="0" data-card="h1" data-message-type="info" aria-label="Show information" title="Information">i</span>
            <span class="message-icon caution-icon" role="button" tabindex="0" data-card="h1" data-message-type="caution" aria-label="Show caution" title="Caution">!</span>
            <span class="arrow" aria-hidden="true">›</span>
          </span>
        </button>
      </div>
      <div class="code-row-wrap">
        <button class="code-row" id="open-hg-npi" type="button" data-source="hg-npi-source" data-title="Healthgrades NPI Extractor">
          <span class="code-name">Healthgrades NPI Extractor</span>
          <span class="code-description">Extract NPI, H1 text, HTTP status, redirects, stop triggers, and availability text from Healthline provider URLs.</span>
          <span class="row-end">
            <span class="message-icon info-icon" role="button" tabindex="0" data-card="hg" data-message-type="info" aria-label="Show information" title="Information">i</span>
            <span class="message-icon caution-icon" role="button" tabindex="0" data-card="hg" data-message-type="caution" aria-label="Show caution" title="Caution">!</span>
            <span class="arrow" aria-hidden="true">›</span>
          </span>
        </button>
      </div>

      <div class="code-row-wrap">
        <button class="code-row" id="open-excel-dump" type="button" data-source="excel-dump-source" data-title="Excel Dump VBA">
          <span class="code-name">Excel Dump VBA</span>
          <span class="code-description">Runs the Excel dump workflow, source comparisons, duplicate checks, harvester counts, URL extraction, scope checks, and progress tracking.</span>
          <span class="row-end">
            <span class="message-icon info-icon" role="button" tabindex="0" data-card="excelDump" data-message-type="info" aria-label="Show information" title="Information">i</span>
            <span class="message-icon caution-icon" role="button" tabindex="0" data-card="excelDump" data-message-type="caution" aria-label="Show caution" title="Caution">!</span>
            <span class="arrow" aria-hidden="true">›</span>
          </span>
        </button>
      </div>
      <div class="code-row-wrap">
        <button class="code-row" id="open-webmd-npi" type="button" data-source="webmd-npi-source" data-title="Vitals / WebMD NPI Extractor">
          <span class="code-name">Vitals / WebMD NPI Extractor</span>
          <span class="code-description">Processes WebMD provider URLs, extracts NPI numbers, handles rate limits, tracks progress, and downloads CSV results.</span>
          <span class="row-end">
            <span class="message-icon info-icon" role="button" tabindex="0" data-card="webmdNpi" data-message-type="info" aria-label="Show information" title="Information">i</span>
            <span class="message-icon caution-icon" role="button" tabindex="0" data-card="webmdNpi" data-message-type="caution" aria-label="Show caution" title="Caution">!</span>
            <span class="arrow" aria-hidden="true">›</span>
          </span>
        </button>
      </div>
      <p class="empty-note">Select any tool to view, edit, and copy its complete code.</p>
    </section>
  </main>

  <div class="modal" id="code-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <section class="dialog">
      <header class="dialog-head">
        <h2 class="dialog-title" id="modal-title">Extract &lt;H1&gt;</h2>
        <div class="dialog-actions"><button class="action" id="edit-button" type="button">Edit</button><button class="action copy" id="copy-button" type="button">Copy</button><button class="action close" id="close-button" type="button">Close</button></div>
      </header>
      <div class="editor-wrap"><textarea class="editor" id="code-editor" readonly spellcheck="false" aria-label="Extract H1 code"></textarea></div>
      <footer class="dialog-foot"><span id="mode-label">View mode</span><span>Esc to close</span></footer>
    </section>
  </div>

  <div class="message-modal" id="message-modal" role="dialog" aria-modal="true" aria-labelledby="message-modal-title">
    <section class="message-dialog" id="message-dialog">
      <header class="message-dialog-head"><span class="message-dialog-icon" id="message-dialog-icon">i</span><h2 class="message-dialog-title" id="message-modal-title">Information</h2></header>
      <p class="message-dialog-text" id="message-modal-text"></p>
      <footer class="message-dialog-foot"><button class="message-dialog-close" id="message-modal-close" type="button">Close</button></footer>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script id="hg-npi-source" type="text/plain">
(async () => {
  // -----------------------
  // Config
  // -----------------------
  const delayMs = 1250;
  const batchSize = 1;
  const maxRetries = 3;
  const fileName = "healthgrades_npi_results.csv";

  // Stop scraping when this HTTP status is encountered
  const stopOnStatusCode = 403;

  // Shared stop state
  let stopRequested = false;
  const activeControllers = new Set();

  // Paste URLs here one per line
  // Duplicates are allowed and will be processed as-is.
  const urlText = `

https://care.healthline.com/find-care/provider/dr-sudhaker-rao-1942378476
https://care.healthline.com/find-care/provider/dr-krishna-sawhney-1417052424
https://care.healthline.com/find-care/provider/dr-karen-park-1851499099
https://care.healthline.com/find-care/provider/dr-ghaus-malik-1497820138
https://care.healthline.com/find-care/provider/dr-olusegun-osinbowale-1114065547
https://care.healthline.com/find-care/provider/dr-syed-ahsan-1851568216
https://care.healthline.com/find-care/provider/dr-mohammad-alhyari-1346554912
https://care.healthline.com/find-care/provider/dr-neil-simmerman-1376704759
https://care.healthline.com/find-care/provider/dr-pete-janevski-1306909924
https://care.healthline.com/find-care/provider/dr-raed-alnajjar-1215107982
https://care.healthline.com/find-care/provider/dr-jyothsna-herek-1669676169
https://care.healthline.com/find-care/provider/dr-henry-lim-1710065842
https://care.healthline.com/find-care/provider/dr-john-corcoran-1053350603
https://care.healthline.com/find-care/provider/dr-claudio-schuger-1720179211
https://care.healthline.com/find-care/provider/dr-amit-mohindra-1427029453
https://care.healthline.com/find-care/provider/dr-frederic-sulak-1720156268


  `.trim();

  // -----------------------
  // Timing / Progress
  // -----------------------
  const startTime = Date.now();

  function formatDuration(ms) {
    if (!isFinite(ms) || ms < 0) return "--";

    const totalSeconds = Math.floor(ms / 1000);
    const hrs = Math.floor(totalSeconds / 3600);
    const mins = Math.floor((totalSeconds % 3600) / 60);
    const secs = totalSeconds % 60;

    if (hrs > 0) return `${hrs}h ${mins}m ${secs}s`;
    if (mins > 0) return `${mins}m ${secs}s`;
    return `${secs}s`;
  }

  function formatClockTime(ts) {
    if (!isFinite(ts)) return "--";
    return new Date(ts).toLocaleTimeString();
  }

  function updateProgress(done, total, currentUrl = "", note = "") {
    const pct = total ? Math.floor((done / total) * 100) : 0;
    const barSize = 30;
    const filled = Math.floor((pct / 100) * barSize);
    const bar = "█".repeat(filled) + "░".repeat(barSize - filled);

    const elapsedMs = Date.now() - startTime;
    const avgPerItemMs = done > 0 ? elapsedMs / done : 0;
    const remaining = Math.max(total - done, 0);
    const etaMs = done > 0 ? avgPerItemMs * remaining : 0;
    const finishTs = done > 0 ? Date.now() + etaMs : 0;

    console.clear();
    console.log(`Scraping Healthgrades (${done}/${total})`);
    console.log(`[${bar}] ${pct}%`);
    console.log(`Elapsed: ${formatDuration(elapsedMs)}`);
    console.log(`ETA: ${done > 0 ? formatDuration(etaMs) : "--"}`);
    console.log(`Estimated Finish: ${done > 0 ? formatClockTime(finishTs) : "--"}`);

    if (currentUrl) console.log(`Current: ${currentUrl}`);
    if (note) console.log(`Status: ${note}`);

    if (stopRequested) {
      console.log(`🛑 Stop requested because HTTP ${stopOnStatusCode} was found.`);
    }
  }

  // -----------------------
  // Utilities
  // -----------------------
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const clean = (s) => {
    return (s || "").replace(/\s+/g, " ").trim();
  };

  function normalizeUrl(u) {
    if (!u) return "";

    let url = u.trim();

    url = url.replace(/[?&]place-id=(?=&|$)/i, "");
    url = url.replace(/[?&]$/g, "");
    url = url.replace(/\?place-id$/i, "");
    url = url.replace(/^http:\/\//i, "https://");

    return url;
  }

  function sanitize(s) {
    if (!s) return "";
    return clean(String(s));
  }

  function requestStop() {
    stopRequested = true;

    for (const controller of activeControllers) {
      try {
        controller.abort();
      } catch {}
    }

    activeControllers.clear();
  }

  // -----------------------
  // NPI Extraction
  // -----------------------
  function extractNpisFromHtml(html) {
    const hits = new Set();
    let m;

    const reEscaped = /npi\\":\\"(\d{10})\\"/g;
    while ((m = reEscaped.exec(html)) !== null) {
      hits.add(m[1]);
    }

    const reJson = /"npi"\s*:\s*"(\d{10})"/gi;
    while ((m = reJson.exec(html)) !== null) {
      hits.add(m[1]);
    }

    const reNpiNumber = /"npiNumber"\s*:\s*"(\d{10})"/gi;
    while ((m = reNpiNumber.exec(html)) !== null) {
      hits.add(m[1]);
    }

    const reLoose = /npi[^0-9]{0,50}(\d{10})/gi;
    while ((m = reLoose.exec(html)) !== null) {
      hits.add(m[1]);
    }

    return [...hits];
  }

  // -----------------------
  // H1 Extraction
  // -----------------------
  function extractH1TextFromHtml(html) {
    try {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const h1 = doc.querySelector("h1");
      return sanitize(h1?.textContent || "");
    } catch {
      return "";
    }
  }

  // -----------------------
  // Strong Text Extraction
  // -----------------------
  function extractStrongUnavailableTextFromHtml(html) {
    try {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const strongs = [...doc.querySelectorAll("strong")];

      const targetText = "This page is not available in your area.";

      const found = strongs.find((el) => sanitize(el.textContent || "") === targetText);

      return found ? targetText : "";
    } catch {
      return "";
    }
  }

  // -----------------------
  // Fetch with retries
  // -----------------------
  async function fetchWithRetry(url, attempt = 0) {
    if (stopRequested) {
      throw new Error("STOP_REQUESTED");
    }

    const controller = new AbortController();
    activeControllers.add(controller);

    const timeout = setTimeout(() => {
      try {
        controller.abort();
      } catch {}
    }, 25000);

    try {
      const res = await fetch(url, {
        credentials: "include",
        signal: controller.signal,
        headers: {
          "User-Agent": navigator.userAgent,
          "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
          "Accept-Language": "en-US,en;q=0.9",
          "Cache-Control": "no-cache",
          "Pragma": "no-cache"
        }
      });

      // If 405 found, trigger global stop immediately.
      if (res.status === stopOnStatusCode) {
        requestStop();
        return res;
      }

      // Do not retry if stop was requested by another request.
      if (stopRequested) {
        throw new Error("STOP_REQUESTED");
      }

      if (!res.ok) {
        const retryable = [429, 500, 502, 503, 504].includes(res.status);

        if (retryable && attempt < maxRetries && !stopRequested) {
          const backoff = (attempt + 1) * 1200 + Math.floor(Math.random() * 500);
          await sleep(backoff);
          return fetchWithRetry(url, attempt + 1);
        }
      }

      return res;
    } finally {
      clearTimeout(timeout);
      activeControllers.delete(controller);
    }
  }

  // -----------------------
  // Build combined status/error value
  // -----------------------
  function buildStatusCodeError(res, npi) {
    const statusCode = String(res.status || "");

    if (!res.ok) {
      return statusCode;
    }

    if (!npi) {
      return `${statusCode} (Search page)`;
    }

    return statusCode;
  }

  // -----------------------
  // Scrape one URL
  // -----------------------
  async function scrapeOne(inputUrl) {
    const url = normalizeUrl(inputUrl);

    if (stopRequested) {
      return {
        URL: url,
        StatusCode_ErrorCode: "SKIPPED_STOP_REQUESTED",
        NPI: "",
        H1_Text: "",
        Redirect: "No",
        StopTriggered: "No",
        Strong_Text: ""
      };
    }

    await sleep(delayMs + Math.floor(Math.random() * 250));

    if (stopRequested) {
      return {
        URL: url,
        StatusCode_ErrorCode: "SKIPPED_STOP_REQUESTED",
        NPI: "",
        H1_Text: "",
        Redirect: "No",
        StopTriggered: "No",
        Strong_Text: ""
      };
    }

    try {
      const res = await fetchWithRetry(url);

      let html = "";
      try {
        html = await res.text();
      } catch {
        html = "";
      }

      const npis = extractNpisFromHtml(html);
      const npi = sanitize(npis[0] || "");
      const h1Text = extractH1TextFromHtml(html);
      const strongText = extractStrongUnavailableTextFromHtml(html);
      const redirect = res.redirected ? "Yes" : "No";
      const statusCodeError = buildStatusCodeError(res, npi);

      return {
        URL: url,
        StatusCode_ErrorCode: statusCodeError,
        NPI: npi,
        H1_Text: h1Text,
        Redirect: redirect,
        StopTriggered: res.status === stopOnStatusCode ? "Yes" : "No",
        Strong_Text: strongText
      };
    } catch (e) {
      let statusCodeError = "UNKNOWN_ERROR";

      if (e?.message === "STOP_REQUESTED") {
        statusCodeError = "SKIPPED_STOP_REQUESTED";
      } else if (e?.name === "AbortError") {
        statusCodeError = stopRequested ? "ABORTED_STOP_REQUESTED" : "TIMEOUT";
      } else if (e?.name) {
        statusCodeError = e.name.toUpperCase();
      } else if (e?.message) {
        statusCodeError = sanitize(e.message).slice(0, 100);
      }

      return {
        URL: url,
        StatusCode_ErrorCode: statusCodeError,
        NPI: "",
        H1_Text: "",
        Redirect: "No",
        StopTriggered: "No",
        Strong_Text: ""
      };
    }
  }

  // -----------------------
  // Batch runner
  // Keeps batch processing
  // Stops starting new batches once 405 is found
  // -----------------------
  async function runInBatches(urls, batchSize) {
    const results = [];
    let done = 0;

    for (let i = 0; i < urls.length; i += batchSize) {
      if (stopRequested) {
        console.warn(`🛑 Stopping before next batch because HTTP ${stopOnStatusCode} was encountered.`);
        break;
      }

      const batch = urls.slice(i, i + batchSize);

      updateProgress(
        done,
        urls.length,
        normalizeUrl(batch[0] || ""),
        `Starting batch ${Math.floor(i / batchSize) + 1}`
      );

      const batchResults = await Promise.all(
        batch.map(async (url) => {
          const normalizedUrl = normalizeUrl(url);

          if (stopRequested) {
            return {
              URL: normalizedUrl,
              StatusCode_ErrorCode: "SKIPPED_STOP_REQUESTED",
              NPI: "",
              H1_Text: "",
              Redirect: "No",
              StopTriggered: "No",
              Strong_Text: ""
            };
          }

          updateProgress(done, urls.length, normalizedUrl, "Working...");

          const r = await scrapeOne(url);

          done++;

          const note = `StatusCode/ErrorCode: ${r.StatusCode_ErrorCode} | Redirect: ${r.Redirect}`;
          updateProgress(done, urls.length, r.URL, note);

          if (r.StopTriggered === "Yes") {
            console.warn(`🛑 HTTP ${stopOnStatusCode} found at URL: ${r.URL}`);
          }

          return r;
        })
      );

      // Keep only meaningful attempted/stopped rows.
      // If you want skipped rows also included, remove this filter.
      const filteredBatchResults = batchResults.filter(
        (r) => r.StatusCode_ErrorCode !== "SKIPPED_STOP_REQUESTED"
      );

      results.push(...filteredBatchResults);

      if (batchResults.some((r) => r.StopTriggered === "Yes")) {
        console.warn(`🛑 Stopping after current batch because HTTP ${stopOnStatusCode} was encountered.`);
        break;
      }

      await sleep(350);
    }

    return results;
  }

  // -----------------------
  // Build URL list
  // -----------------------
  // IMPORTANT:
  // Duplicates are intentionally preserved.
  // No Set() is used here.
  const urls = urlText
    .split(/\n+/)
    .map((s) => s.trim())
    .filter(Boolean)
    .map(normalizeUrl);

  if (!urls.length) {
    console.warn("No URLs found in urlText.");
    return [];
  }

  // -----------------------
  // Run
  // -----------------------
  updateProgress(0, urls.length, "", "Starting...");
  const results = await runInBatches(urls, batchSize);

  // -----------------------
  // CSV export
  // -----------------------
  const cols = [
    "URL",
    "StatusCode_ErrorCode",
    "NPI",
    "H1_Text",
    "Redirect",
    "StopTriggered",
    "Strong_Text"
  ];

  const csv = [
    cols.join(","),
    ...results.map((r) =>
      cols
        .map((c) => `"${String(r[c] ?? "").replace(/"/g, '""')}"`)
        .join(",")
    )
  ].join("\n");

  let copied = false;

  try {
    if (typeof copy === "function") {
      copy(csv);
      copied = true;
      console.log("📋 CSV copied to clipboard");
    }
  } catch {}

  if (!copied) {
    const blob = new Blob([csv], {
      type: "text/csv;charset=utf-8"
    });

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();

    console.log("⬇️ CSV downloaded:", fileName);
  }

  const totalElapsed = Date.now() - startTime;

  console.clear();
  console.log("🎉 DONE — Results:");
  console.log(`Total Time: ${formatDuration(totalElapsed)}`);

  if (results.some((r) => r.StopTriggered === "Yes")) {
    console.log(`🛑 Script stopped early because HTTP ${stopOnStatusCode} was encountered.`);
  }

  console.table(results);

  return results;
})();

Option Explicit

Private Const SOURCE_HEADER As String = "SOURCE_NAME"
Private Const PLACE_ID_HEADER As String = "PLACE_ID"
Private Const ENTITY_ID_HEADER As String = "ENTITY_ID"
Private Const PRODUCT_ID_HEADER As String = "PRODUCT_ID"
Private Const URL_HEADER As String = "URL"

Private oldCalc As XlCalculation
Private oldStatusBar As Variant
Private oldScreenUpdating As Boolean
Private oldEnableEvents As Boolean
Private oldDisplayAlerts As Boolean

Sub Main()
    On Error GoTo ErrHandler
    StartSafeMode
    ProgressBar 0, 100, "Starting dump..."
    MsgBoxWithOptions
    ProgressBar 5, 100, "Copying Google data...": CopyGoogleDataToNewSheet
    ProgressBar 15, 100, "Sorting Sheet1...": SortAscendingColumnBExceptFirstRow
    ProgressBar 25, 100, "Creating comparison sheets..."
    BuildComparisonSheet "YP&amp;SP", "Super Pages", "Yellow Pages", "Missing YP", "Missing SP", "", ""
    BuildComparisonSheet "V,W", "Vitals", "WebMD", "Missing Vitals", "Missing WebMD", "Duplicate Vitals", "Duplicate WebMD"
    BuildComparisonSheet "HG,SC", "Healthgrades", "Sharecare", "Missing Healthgrades", "Missing Sharecare", "Duplicate Healthgrades", "Duplicate Sharecare"
    ProgressBar 58, 100, "Creating duplicate source sheets...": FilterAndCopySourceHighlightDuplicates "Doctor.com", "DUP DOC"
    ProgressBar 68, 100, "Counting harvesters...": HarvesterCount
    ProgressBar 75, 100, "Creating docspot sheet...": Docspot_Combined_Compared
    ProgressBar 82, 100, "Copying Wellness URLs...": CopyAndFormatURLs
    ProgressBar 88, 100, "Copying RateMDs URLs...": CopyRateMDsLinks
    ProgressBar 93, 100, "Creating Scope check...": ScopeCheck
    ProgressBar 98, 100, "Calculating differences...": CalculateColumnCDifference
    ProgressBar 100, 100, "Completed."
CleanExit:
    RestoreExcel
    MsgBox "All scripts have been run successfully.", vbInformation
    Exit Sub
ErrHandler:
    RestoreExcel
    MsgBox "Error: " &amp; Err.Description, vbCritical, "Macro stopped"
End Sub

Sub StartSafeMode()
    oldCalc = Application.Calculation: oldStatusBar = Application.StatusBar
    oldScreenUpdating = Application.ScreenUpdating: oldEnableEvents = Application.EnableEvents
    oldDisplayAlerts = Application.DisplayAlerts
    Application.ScreenUpdating = False: Application.EnableEvents = False
    Application.DisplayAlerts = False: Application.Calculation = xlCalculationManual
    Application.StatusBar = False
End Sub

Sub RestoreExcel()
    Application.ScreenUpdating = oldScreenUpdating: Application.EnableEvents = oldEnableEvents
    Application.DisplayAlerts = oldDisplayAlerts: Application.Calculation = oldCalc
    Application.StatusBar = False: Application.CutCopyMode = False
End Sub

Sub ProgressBar(ByVal currentStep As Long, ByVal totalSteps As Long, ByVal message As String)
    Dim pct As Double, filledBars As Long
    If totalSteps = 0 Then totalSteps = 1
    pct = currentStep / totalSteps: If pct &lt; 0 Then pct = 0 Else If pct &gt; 1 Then pct = 1
    filledBars = CLng(pct * 30)
    Application.StatusBar = message &amp; "  [" &amp; String(filledBars, "#") &amp; String(30 - filledBars, "-") &amp; "] " &amp; Format(pct, "0%")
    DoEvents
End Sub

Function NormalizeText(ByVal value As Variant) As String
    If IsError(value) Then NormalizeText = "": Exit Function
    NormalizeText = LCase(Trim(Application.WorksheetFunction.Clean(Replace(Replace(CStr(value), vbCr, ""), vbLf, ""))))
End Function

Function GetHeaderColumn(ws As Worksheet, headerName As String) As Long
    Dim c As Long, lastCol As Long: lastCol = ws.Cells(1, ws.Columns.Count).End(xlToLeft).Column
    For c = 1 To lastCol
        If NormalizeText(ws.Cells(1, c).Value) = NormalizeText(headerName) Then GetHeaderColumn = c: Exit Function
    Next c
    Err.Raise vbObjectError + 1001, , "Header '" &amp; headerName &amp; "' not found in sheet '" &amp; ws.Name &amp; "'."
End Function

Function LastRowByColumn(ws As Worksheet, colNum As Long) As Long
    LastRowByColumn = ws.Cells(ws.Rows.Count, colNum).End(xlUp).Row
End Function

Sub CreateOrClearSheet(sheetName As String)
    Dim ws As Worksheet: On Error Resume Next: Set ws = ThisWorkbook.Sheets(sheetName): On Error GoTo 0
    If ws Is Nothing Then Set ws = ThisWorkbook.Sheets.Add(After:=Sheets(Sheets.Count)): ws.Name = sheetName Else If ws.AutoFilterMode Then ws.AutoFilterMode = False: ws.Cells.Clear: ws.Cells.FormatConditions.Delete
End Sub

Sub DeleteSheetIfExists(sheetName As String)
    Dim ws As Worksheet: On Error Resume Next: Set ws = ThisWorkbook.Sheets(sheetName): On Error GoTo 0
    If Not ws Is Nothing Then Application.DisplayAlerts = False: ws.Delete: Application.DisplayAlerts = oldDisplayAlerts
End Sub

Sub MsgBoxWithOptions()
    Dim result As Integer: result = MsgBox("Do you want to check your dump?", vbYesNoCancel + vbQuestion, "Confirmation")
    If result = vbYes Then MsgBox "Results may be inaccurate.", vbInformation Else MsgBox "The dump will run anyway.", vbInformation
End Sub

Sub CopyGoogleDataToNewSheet()
    Dim src As Worksheet, dst As Worksheet, cols, d As Object, i As Long, r As Long, j As Long, sc As Long, pc As Long, pTarget As Long, v
    Set src = Sheets("Sheet1"): sc = GetHeaderColumn(src, SOURCE_HEADER): pc = GetHeaderColumn(src, PLACE_ID_HEADER)
    CreateOrClearSheet "Place ID_" &amp; src.Name: Set dst = Sheets("Place ID_" &amp; src.Name)
    Set d = CreateObject("Scripting.Dictionary"): cols = Array(2, 7, 14, 15, sc, pc)
    For Each v In cols
        If NormalizeText(src.Cells(1, CLng(v)).Value) &lt;&gt; "modified_time" And Not d.Exists(CStr(v)) Then d.Add CStr(v), d.Count + 1: If CLng(v) = pc Then pTarget = d(CStr(v))
    Next v
    For Each v In cols
        If d.Exists(CStr(v)) Then dst.Cells(1, d(CStr(v))).Value = src.Cells(1, CLng(v)).Value
    Next v
    r = 2
    For i = 2 To LastRowByColumn(src, sc)
        If NormalizeText(src.Cells(i, sc).Value) = "google" Then
            For Each v In cols
                If d.Exists(CStr(v)) Then dst.Cells(r, d(CStr(v))).Value = src.Cells(i, CLng(v)).Value
            Next v
            r = r + 1
        End If
    Next i
    dst.Columns.AutoFit: If r &gt; 2 Then HighlightDuplicateColumn dst, pTarget, 2
End Sub

Sub HighlightDuplicateColumn(ws As Worksheet, colNum As Long, startRow As Long)
    Dim lr As Long, rng As Range: lr = ws.Cells(ws.Rows.Count, colNum).End(xlUp).Row: If lr &lt; startRow Then Exit Sub
    Set rng = ws.Range(ws.Cells(startRow, colNum), ws.Cells(lr, colNum)): rng.FormatConditions.Delete
    With rng.FormatConditions.AddUniqueValues: .DupeUnique = xlDuplicate: .Font.Color = -16383844: .Interior.Color = 13551615: End With
End Sub

Sub SortAscendingColumnBExceptFirstRow()
    Dim ws As Worksheet, lr As Long, lc As Long: Set ws = Sheets("Sheet1")
    lr = ws.Cells(ws.Rows.Count, "B").End(xlUp).Row: lc = ws.Cells(1, ws.Columns.Count).End(xlToLeft).Column
    If lr &gt;= 2 Then ws.Range(ws.Cells(1, 1), ws.Cells(lr, lc)).Sort Key1:=ws.Range("B1"), Order1:=xlAscending, Header:=xlYes
End Sub

Sub BuildComparisonSheet(sheetName As String, firstSource As String, secondSource As String, missingFirstHeader As String, missingSecondHeader As String, duplicateFirstHeader As String, duplicateSecondHeader As String)
    Dim src As Worksheet, dst As Worksheet, sc As Long, lr As Long
    Set src = Sheets("Sheet1"): sc = GetHeaderColumn(src, SOURCE_HEADER): lr = LastRowByColumn(src, sc)
    CreateOrClearSheet sheetName: Set dst = Sheets(sheetName)
    dst.Range("A1:E1").Value = Array(firstSource, secondSource, "Difference", missingFirstHeader, missingSecondHeader)
    CopySourceValuesToColumn src, dst, firstSource, 1, sc, lr: CopySourceValuesToColumn src, dst, secondSource, 2, sc, lr
    FillMissingColumns dst, 1, 2, 4, 5
    If duplicateFirstHeader &lt;&gt; "" Then dst.Cells(1, 6) = duplicateFirstHeader: FillDuplicateValuesFromColumn dst, 1, 6: HighlightDuplicateColumn dst, 6, 2
    If duplicateSecondHeader &lt;&gt; "" Then dst.Cells(1, 7) = duplicateSecondHeader: FillDuplicateValuesFromColumn dst, 2, 7: HighlightDuplicateColumn dst, 7, 2
    HighlightComparisonDuplicates dst: dst.Columns.AutoFit
End Sub

Sub CopySourceValuesToColumn(src As Worksheet, dst As Worksheet, sourceName As String, targetColumn As Long, sourceCol As Long, lastRow As Long)
    Dim i As Long, r As Long: r = 2
    For i = 2 To lastRow
        If NormalizeText(src.Cells(i, sourceCol).Value) = NormalizeText(sourceName) Then dst.Cells(r, targetColumn).Value = src.Cells(i, "B").Value: r = r + 1
    Next i
End Sub

Sub FillMissingColumns(ws As Worksheet, firstCol As Long, secondCol As Long, missingFirstCol As Long, missingSecondCol As Long)
    Dim a As Object, b As Object, out As Object, i As Long, r As Long, v As String
    Set a = CreateObject("Scripting.Dictionary"): Set b = CreateObject("Scripting.Dictionary")
    For i = 2 To ws.Cells(ws.Rows.Count, firstCol).End(xlUp).Row: v = NormalizeText(ws.Cells(i, firstCol).Value): If v &lt;&gt; "" Then a(v) = ws.Cells(i, firstCol).Value
    Next i
    For i = 2 To ws.Cells(ws.Rows.Count, secondCol).End(xlUp).Row: v = NormalizeText(ws.Cells(i, secondCol).Value): If v &lt;&gt; "" Then b(v) = ws.Cells(i, secondCol).Value
    Next i
    Set out = CreateObject("Scripting.Dictionary"): r = 2
    For i = 2 To ws.Cells(ws.Rows.Count, secondCol).End(xlUp).Row: v = NormalizeText(ws.Cells(i, secondCol).Value): If v &lt;&gt; "" And Not a.Exists(v) And Not out.Exists(v) Then ws.Cells(r, missingFirstCol) = ws.Cells(i, secondCol).Value: out(v) = True: r = r + 1
    Next i
    Set out = CreateObject("Scripting.Dictionary"): r = 2
    For i = 2 To ws.Cells(ws.Rows.Count, firstCol).End(xlUp).Row: v = NormalizeText(ws.Cells(i, firstCol).Value): If v &lt;&gt; "" And Not b.Exists(v) And Not out.Exists(v) Then ws.Cells(r, missingSecondCol) = ws.Cells(i, firstCol).Value: out(v) = True: r = r + 1
    Next i
End Sub

Sub FillDuplicateValuesFromColumn(ws As Worksheet, sourceCol As Long, targetCol As Long)
    Dim d As Object, o As Object, i As Long, r As Long, v As String: Set d = CreateObject("Scripting.Dictionary"): Set o = CreateObject("Scripting.Dictionary")
    For i = 2 To ws.Cells(ws.Rows.Count, sourceCol).End(xlUp).Row: v = NormalizeText(ws.Cells(i, sourceCol).Value): If v &lt;&gt; "" Then d(v) = d(v) + 1
    Next i
    r = 2
    For i = 2 To ws.Cells(ws.Rows.Count, sourceCol).End(xlUp).Row: v = NormalizeText(ws.Cells(i, sourceCol).Value): If v &lt;&gt; "" And d(v) &gt; 1 And Not o.Exists(v) Then ws.Cells(r, targetCol) = ws.Cells(i, sourceCol).Value: o(v) = True: r = r + 1
    Next i
End Sub

Sub HighlightComparisonDuplicates(ws As Worksheet)
    Dim lr As Long, rng As Range: lr = Application.Max(ws.Cells(ws.Rows.Count, "A").End(xlUp).Row, ws.Cells(ws.Rows.Count, "B").End(xlUp).Row): If lr &lt; 2 Then Exit Sub
    Set rng = ws.Range("A2:B" &amp; lr): rng.FormatConditions.Delete
    With rng.FormatConditions.AddUniqueValues: .DupeUnique = xlDuplicate: .Font.Color = -16383844: .Interior.Color = 13551615: End With
End Sub

Sub FilterAndCopySourceHighlightDuplicates(sourceName As String, destinationSheetName As String)
    Dim src As Worksheet, dst As Worksheet, sc As Long, i As Long, r As Long: Set src = Sheets("Sheet1"): sc = GetHeaderColumn(src, SOURCE_HEADER)
    CreateOrClearSheet destinationSheetName: Set dst = Sheets(destinationSheetName): dst.Cells(1, 1) = sourceName &amp; " Values": r = 2
    For i = 2 To LastRowByColumn(src, sc): If NormalizeText(src.Cells(i, sc).Value) = NormalizeText(sourceName) And Trim(CStr(src.Cells(i, "B").Value)) &lt;&gt; "" Then dst.Cells(r, 1) = src.Cells(i, "B").Value: r = r + 1
    Next i
    If r &gt; 2 Then HighlightDuplicateColumn dst, 1, 2
End Sub

Sub HarvesterCount()
    Dim src As Worksheet, dst As Worksheet, d As Object, i As Long, r As Long, v As String, k
    Set src = Sheets("Sheet1"): CreateOrClearSheet "Harvester Count": Set dst = Sheets("Harvester Count"): Set d = CreateObject("Scripting.Dictionary")
    For i = 2 To src.Cells(src.Rows.Count, "B").End(xlUp).Row: v = Trim(CStr(src.Cells(i, "B").Value)): If v &lt;&gt; "" Then d(v) = d(v) + 1
    Next i
    dst.Range("A1:B1") = Array("Harvester", "Harvester Count"): r = 2
    For Each k In d.Keys: dst.Cells(r, 1) = k: dst.Cells(r, 2) = d(k): r = r + 1: Next k
End Sub

Sub Docspot_Combined_Compared()
    Dim src As Worksheet, dst As Worksheet, all As Object, ds As Object, cnt As Object, i As Long, r As Long, v As String, k, sc As Long
    Set src = Sheets("Sheet1"): sc = GetHeaderColumn(src, SOURCE_HEADER): DeleteSheetIfExists "Missing DS": DeleteSheetIfExists "DUP DP": CreateOrClearSheet "docspot": Set dst = Sheets("docspot")
    Set all = CreateObject("Scripting.Dictionary"): Set ds = CreateObject("Scripting.Dictionary"): Set cnt = CreateObject("Scripting.Dictionary")
    For i = 2 To Application.Max(src.Cells(src.Rows.Count, "B").End(xlUp).Row, LastRowByColumn(src, sc))
        v = Trim(CStr(src.Cells(i, "B").Value)): If v &lt;&gt; "" Then all(v) = True
        If NormalizeText(src.Cells(i, sc).Value) = "docspot" And v &lt;&gt; "" Then ds(v) = True: cnt(v) = cnt(v) + 1
    Next i
    dst.Range("A1:E1") = Array("Unique DS Values", "Docspot Values from Sheet1 Column B", "Comparison", "Missing Docspot", "DUP DP")
    r = 2: For Each k In all.Keys: dst.Cells(r, 1) = k: If ds.Exists(k) Then dst.Cells(r, 3) = "Match" Else dst.Cells(r, 3) = "No Match": dst.Cells(dst.Cells(dst.Rows.Count, 4).End(xlUp).Row + 1, 4) = k: r = r + 1: Next k
    r = 2: For Each k In ds.Keys: dst.Cells(r, 2) = k: r = r + 1: Next k
    r = 2: For Each k In cnt.Keys: If cnt(k) &gt; 1 Then dst.Cells(r, 5) = k: r = r + 1
    Next k
End Sub

Sub CopyAndFormatURLs(): CopySourceUrlData "wellness", "dup well", "Wellness URL": End Sub
Sub CopyRateMDsLinks(): CopySourceUrlData "ratemds", "DUP RMDS", "RateMDs URL": End Sub

Sub CopySourceUrlData(sourceName As String, sheetName As String, urlHeader As String)
    Dim src As Worksheet, dst As Worksheet, sc As Long, ec As Long, uc As Long, i As Long, r As Long, n As String, sn As String
    Set src = Sheets("Sheet1"): sc = GetHeaderColumn(src, SOURCE_HEADER): ec = GetHeaderColumn(src, ENTITY_ID_HEADER): uc = GetHeaderColumn(src, URL_HEADER)
    CreateOrClearSheet sheetName: Set dst = Sheets(sheetName): dst.Range("A1:C1") = Array(urlHeader, "ENTITY_ID", "number in URL"): r = 2
    For i = 2 To LastRowByColumn(src, sc)
        sn = NormalizeText(src.Cells(i, sc).Value)
        If sn = sourceName Or (sourceName = "ratemds" And (sn = "rate mds" Or sn = "rate md" Or sn = "ratemd")) Then
            dst.Cells(r, 1) = src.Cells(i, uc).Value: dst.Cells(r, 2) = src.Cells(i, ec).Value: n = ExtractFirstNumberFromText(CStr(src.Cells(i, uc).Value)): dst.Cells(r, 3) = IIf(n = "", "na", n): r = r + 1
        End If
    Next i
    If r &gt; 2 Then HighlightDuplicateColumn dst, 2, 2: HighlightDuplicateColumn dst, 3, 2
End Sub

Sub ScopeCheck()
    Dim src As Worksheet, dst As Worksheet, pc As Long, ec As Long, i As Long, r As Long, t As Long, d As Object, p As String, e As String, k
    Set src = Sheets("Sheet1"): pc = GetHeaderColumn(src, PRODUCT_ID_HEADER): ec = GetHeaderColumn(src, ENTITY_ID_HEADER)
    CreateOrClearSheet "Scope check": Set dst = Sheets("Scope check"): Set d = CreateObject("Scripting.Dictionary"): dst.Range("A1:C1") = Array("PRODUCT_ID", "ENTITY_ID", "PRODUCT_ID Types Available"): r = 2
    For i = 2 To Application.Max(LastRowByColumn(src, pc), LastRowByColumn(src, ec)): p = Trim(CStr(src.Cells(i, pc).Value)): e = Trim(CStr(src.Cells(i, ec).Value)): If p &lt;&gt; "" Or e &lt;&gt; "" Then dst.Cells(r, 1) = p: dst.Cells(r, 2) = e: r = r + 1: If p &lt;&gt; "" Then d(p) = True
    Next i
    t = 2: For Each k In d.Keys: dst.Cells(t, 3) = k: t = t + 1: Next k
End Sub

Function ExtractFirstNumberFromText(ByVal inputText As String) As String
    Dim re As Object: Set re = CreateObject("VBScript.RegExp"): re.Pattern = "\d+": re.Global = False
    If re.Test(inputText) Then ExtractFirstNumberFromText = re.Execute(inputText)(0).Value
End Function

Sub CalculateColumnCDifference()
    Dim names, n, ws As Worksheet, lr As Long: names = Array("V,W", "HG,SC", "YP&amp;SP")
    For Each n In names
        Set ws = Sheets(CStr(n)): lr = Application.Max(ws.Cells(ws.Rows.Count, "A").End(xlUp).Row, ws.Cells(ws.Rows.Count, "B").End(xlUp).Row)
        If lr &gt;= 2 Then ws.Range("C2:C" &amp; lr).Formula = "=IF(OR(A2="""",B2=""""),"""",IFERROR(A2-B2,""""))"
    Next n
End Sub

  function request(url,cb){var x=new XMLHttpRequest(),done=false;function end(err,res){if(done)return;done=true;s.xhr=null;cb(err,res)}x.open('GET',url,true);x.timeout=CONFIG.requestTimeout;x.onreadystatechange=function(){if(x.readyState===4){var h='';try{h=x.getResponseHeader('Retry-After')}catch(ignore){}end(null,{status:x.status,html:x.responseText||'',retryAfter:h})}};x.onerror=function(){end(new Error('Network or CORS request failure'))};x.ontimeout=function(){end(new Error('Request timed out'))};x.onabort=function(){end(new Error('Request aborted'))};s.xhr=x;x.send()}
  function save(url,npi,code,status){s.results.push({url:url,npi:npi,statusCode:code,status:status});s.completed++;s.index++;update()}
  function next(retry){if(!s.running||s.stopped||s.paused)return;if(s.index&gt;=s.urls.length){finish(false);return}var url=s.urls[s.index];text(e.status,(retry?'Retry '+retry+': ':'Requesting ')+(s.index+1)+' of '+s.urls.length);request(url,function(err,res){var max=parseInt(e.retries.value,10),d,npi;if(!s.running)return;if(err){s.errors++;save(url,'',0,err.message);wait(function(){next(0)},normalDelay());return}if(res.status&gt;=200&amp;&amp;res.status&lt;300){s.consecutive429=0;npi=extract(res.html);if(npi)s.found++;else s.missing++;save(url,npi,res.status,npi?'Found':'NPI not found');wait(function(){next(0)},normalDelay());return}if(res.status===429){s.total429++;s.consecutive429++;update();if(retry&lt;max&amp;&amp;s.total429&lt;CONFIG.maximumTotal429){d=retryDelay(retry+1,res.retryAfter);if(s.consecutive429&gt;=CONFIG.consecutive429Limit){d=Math.max(d,CONFIG.cooldownDelay);s.consecutive429=0}text(e.status,'HTTP 429. Waiting '+Math.ceil(d/1000)+' seconds.');wait(function(){next(retry+1)},d);return}s.errors++;save(url,'',429,'HTTP 429: retry limit reached');if(s.total429&gt;=CONFIG.maximumTotal429){finish(true);return}wait(function(){next(0)},CONFIG.cooldownDelay);return}if(res.status&gt;=500&amp;&amp;retry&lt;max){d=retryDelay(retry+1,res.retryAfter);wait(function(){next(retry+1)},d);return}s.errors++;save(url,'',res.status,'HTTP '+res.status);wait(function(){next(0)},normalDelay())})}
  function csv(){var rows=['URL,NPI,Status Code,Status'];s.results.forEach(function(r){rows.push([r.url,r.npi,r.statusCode,r.status].map(function(v){return '"'+String(v||'').replace(/"/g,'""')+'"'}).join(','))});return '\uFEFF'+rows.join('\r\n')}
  function download(){if(!s.results.length)return;var b=new Blob([csv()],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='webmd_npi_data_'+Date.now()+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
  function finish(limited){s.running=false;controls(false);e.pause.disabled=true;e.stop.disabled=true;e.download.disabled=!s.results.length;text(e.start,'Run Again');text(e.status,limited?'Stopped after repeated HTTP 429 responses.':'Completed.');if(s.results.length)download()}
  e.start.onclick=function(){s.urls=parseUrls(e.input.value);if(!s.urls.length){text(e.status,'No valid WebMD URLs found.');return}s.running=true;s.paused=false;s.stopped=false;s.index=s.completed=s.found=s.missing=s.errors=s.total429=s.consecutive429=0;s.results=[];controls(true);update();wait(function(){next(0)},500)};
  e.pause.onclick=function(){s.paused=!s.paused;clearTimeout(s.timer);text(e.pause,s.paused?'Resume':'Pause');text(e.status,s.paused?'Paused':'Resuming');if(!s.paused)wait(function(){next(0)},300)};
  e.stop.onclick=function(){s.stopped=true;s.running=false;clearTimeout(s.timer);if(s.xhr)try{s.xhr.abort()}catch(ignore){}controls(false);e.download.disabled=!s.results.length;text(e.status,'Stopped. Partial results can be downloaded.')};
  e.download.onclick=download;e.close.onclick=function(){s.stopped=true;clearTimeout(s.timer);if(s.xhr)try{s.xhr.abort()}catch(ignore){}panel.remove();style.remove()};
})();
  </script>
  <script>
    const modal=document.getElementById('code-modal'),editor=document.getElementById('code-editor'),editButton=document.getElementById('edit-button'),copyButton=document.getElementById('copy-button'),closeButton=document.getElementById('close-button'),modeLabel=document.getElementById('mode-label'),toast=document.getElementById('toast');
    let toastTimer,lastCodeButton=null;
    function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
    function openModal(button){const sourceElement=document.getElementById(button.dataset.source);if(!sourceElement)return;lastCodeButton=button;editor.value=sourceElement.textContent.trim();editor.readOnly=true;document.getElementById('modal-title').textContent=button.dataset.title;editor.setAttribute('aria-label',button.dataset.title+' code');editButton.textContent='Edit';modeLabel.textContent='View mode';modeLabel.classList.remove('editing');modal.classList.add('open');document.body.style.overflow='hidden';closeButton.focus()}
    function closeModal(){modal.classList.remove('open');document.body.style.overflow='';if(lastCodeButton)lastCodeButton.focus()}
    document.querySelectorAll('.code-row').forEach(button=>button.addEventListener('click',()=>openModal(button)));closeButton.addEventListener('click',closeModal);
    editButton.addEventListener('click',()=>{editor.readOnly=!editor.readOnly;if(editor.readOnly){editButton.textContent='Edit';modeLabel.textContent='View mode';modeLabel.classList.remove('editing');showToast('Editing finished')}else{editButton.textContent='Done';modeLabel.textContent='Editing enabled';modeLabel.classList.add('editing');editor.focus()}});
    copyButton.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(editor.value);showToast('Code copied')}catch(error){editor.focus();editor.select();showToast(document.execCommand('copy')?'Code copied':'Copy failed')}});
    modal.addEventListener('click',event=>{if(event.target===modal)closeModal()});
    editor.addEventListener('keydown',event=>{if(event.key==='Tab'&&!editor.readOnly){event.preventDefault();const start=editor.selectionStart,end=editor.selectionEnd;editor.value=editor.value.substring(0,start)+'  '+editor.value.substring(end);editor.selectionStart=editor.selectionEnd=start+2}});

    const messageModal=document.getElementById('message-modal'),messageDialog=document.getElementById('message-dialog'),messageTitle=document.getElementById('message-modal-title'),messageText=document.getElementById('message-modal-text'),messageIcon=document.getElementById('message-dialog-icon'),messageCloseButton=document.getElementById('message-modal-close');

    // Edit these card-specific popup messages when needed.
    const popupMessages={
      h1:{
        info:{title:'Extract H1 Information',message:'Extracts the page title and first H1 from a list of URLs, with progress tracking, copy, and CSV export.'},
        caution:{title:'Extract H1 Caution',message:'Some websites may block browser fetch requests because of CORS, login requirements, CAPTCHA, or network policy.'}
      },
      hg:{
        info:{title:'Healthgrades NPI Extractor Information',message:'Processes the provider URLs contained in the script and exports NPI, H1, status, redirect, stop-trigger, and availability details.'},
        caution:{title:'Healthgrades NPI Extractor Caution',message:'The script intentionally stops when HTTP 403 is detected. Large batches may also be rate-limited or blocked by the website.'}
      },
      npi:{
        info:{title:'Generate NPI Details Information',message:'Looks up the NPIs contained in the script and downloads the results as a CSV file.'},
        caution:{title:'Generate NPI Details Caution',message:'Run this only where browser requests to the NPI Registry API are allowed. Verify the exported provider details before using them.'}
      },
      excelDump:{
        info:{title:'Excel Dump VBA Information',message:'Runs the complete Excel dump process from the Main macro, including comparison sheets, missing and duplicate checks, harvester counts, source URL extraction, scope checks, and status-bar progress.'},
        caution:{title:'Excel Dump VBA Caution',message:'The workbook must contain Sheet1 and the required SOURCE_NAME, PLACE_ID, ENTITY_ID, PRODUCT_ID, and URL headers. Save a backup because output sheets may be cleared or deleted.'}
      },
      webmdNpi:{
        info:{title:'Vitals / WebMD NPI Extractor Information',message:'Accepts WebMD provider URLs, extracts available NPI numbers, displays request progress, handles HTTP 429 backoff, and downloads CSV results.'},
        caution:{title:'Vitals / WebMD NPI Extractor Caution',message:'WebMD may block browser requests through CORS, rate limiting, CAPTCHA, or access controls. Use a longer interval after repeated HTTP 429 responses and verify every extracted NPI.'}
      }
    };

    let lastMessageButton=null;
    function openMessagePopup(type,clickedButton){const content=popupMessages[clickedButton.dataset.card]?.[type];if(!content)return;lastMessageButton=clickedButton;messageDialog.classList.remove('info','caution');messageDialog.classList.add(type);messageTitle.textContent=content.title;messageText.textContent=content.message;messageIcon.textContent=type==='info'?'i':'!';messageModal.classList.add('open');document.body.style.overflow='hidden';messageCloseButton.focus()}
    function closeMessagePopup(){messageModal.classList.remove('open');document.body.style.overflow='';if(lastMessageButton)lastMessageButton.focus()}
    document.querySelectorAll('.message-icon').forEach(button=>{
      function activate(event){event.preventDefault();event.stopPropagation();openMessagePopup(button.dataset.messageType,button)}
      button.addEventListener('click',activate);
      button.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){activate(event)}});
    });
    messageCloseButton.addEventListener('click',closeMessagePopup);
    messageModal.addEventListener('click',event=>{if(event.target===messageModal)closeMessagePopup()});
    document.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(messageModal.classList.contains('open'))closeMessagePopup();else if(modal.classList.contains('open'))closeModal()});
  </script>
