  <main class="page">
    <header class="topbar">
      <div><div class="eyebrow">Reusable Tools</div><h1>Code Library</h1><p class="subtitle">Process the URLs in batches of 50 to reduce the risk of CAPTCHA challenges and HTTP 429 rate-limit errors..</p></div>
      <a class="back" href="index.html">← Dashboard</a>
    </header>
    <section class="library" aria-label="Code snippets">
      <div class="library-head"><span>Name</span><span>Description</span><span></span></div>
      <div class="code-row-wrap">
        <button class="code-row" id="open-extract-h1" type="button" data-source="extract-h1-source" data-title="Extract &lt;H1&gt;">

          <span class="row-end">
            <span class="message-icon info-icon" role="button" tabindex="0" data-card="h1" data-message-type="info" aria-label="Show information" title="Information">i</span>
            <span class="message-icon caution-icon" role="button" tabindex="0" data-card="h1" data-message-type="caution" aria-label="Show caution" title="Caution">!</span>
            <span class="arrow" aria-hidden="true">›</span>
          </span>
        </button>
      </div>
      <div class="code-row-wrap">
        <button class="code-row" id="open-hg-npi" type="button" data-source="hg-npi-source" data-title=" NPI Extractor (HG,SC,HL,MNT)">
          <span class="code-name"> NPI Extractor (HG,SC,HL,MNT)</span>
          <span class="code-description">Extract NPI, H1 text, HTTP status, redirects, stop triggers, and availability text from Healthline provider URLs.</span>
          <span class="row-end">
            <span class="message-icon info-icon" role="button" tabindex="0" data-card="hg" data-message-type="info" aria-label="Show information" title="Information">i</span>
            <span class="message-icon caution-icon" role="button" tabindex="0" data-card="hg" data-message-type="caution" aria-label="Show caution" title="Caution">!</span>
            <span class="arrow" aria-hidden="true">›</span>
          </span>
        </button>
      </div>

      <div class="code-row-wrap">
        <button class="code-row" id="open-excel-dump" type="button" data-source="excel-dump-source" data-title="Excel Dump VBA (provider)">
          <span class="code-name">Excel Dump VBA (provider)</span>
          <span class="code-description">Runs the Excel dump workflow, source comparisons, duplicate checks, harvester counts, URL extraction, scope checks, and progress tracking.</span>
          <span class="row-end">
            <span class="message-icon info-icon" role="button" tabindex="0" data-card="excelDump" data-message-type="info" aria-label="Show information" title="Information">i</span>
            <span class="message-icon caution-icon" role="button" tabindex="0" data-card="excelDump" data-message-type="caution" aria-label="Show caution" title="Caution">!</span>
            <span class="arrow" aria-hidden="true">›</span>
          </span>
        </button>
      </div>
      <div class="code-row-wrap">
        <button class="code-row" id="open-webmd-npi" type="button" data-source="webmd-npi-source" data-title="Vitals / WebMD NPI Extractor">

          <span class="code-description">Processes WebMD provider URLs, extracts NPI numbers, handles rate limits, tracks progress, and downloads CSV results.</span>
          <span class="row-end">
            <span class="message-icon info-icon" role="button" tabindex="0" data-card="webmdNpi" data-message-type="info" aria-label="Show information" title="Information">i</span>
            <span class="message-icon caution-icon" role="button" tabindex="0" data-card="webmdNpi" data-message-type="caution" aria-label="Show caution" title="Caution">!</span>
            <span class="arrow" aria-hidden="true">›</span>
          </span>
        </button>
      </div>
      <p class="empty-note">Select any tool to view, edit, and copy its complete code.</p>
    </section>
  </main>

  <div class="modal" id="code-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <section class="dialog">
      <header class="dialog-head">
        <h2 class="dialog-title" id="modal-title">Extract &lt;H1&gt;</h2>

      <footer class="dialog-foot"><span id="mode-label">View mode</span><span>Esc to close</span></footer>
    </section>
  </div>

  <div class="message-modal" id="message-modal" role="dialog" aria-modal="true" aria-labelledby="message-modal-title">
    <section class="message-dialog" id="message-dialog">
      <header class="message-dialog-head"><span class="message-dialog-icon" id="message-dialog-icon">i</span><h2 class="message-dialog-title" id="message-modal-title">Information</h2></header>
      <p class="message-dialog-text" id="message-modal-text"></p>
      <footer class="message-dialog-foot"><button class="message-dialog-close" id="message-modal-close" type="button">Close</button></footer>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script id="hg-npi-source" type="text/plain">
(async () => {
  // -----------------------
  // Config
  // -----------------------
  const delayMs = 1250;
  const batchSize = 1;
  const maxRetries = 3;
  const fileName = "healthgrades_npi_results.csv";

  // Stop scraping when this HTTP status is encountered
  const stopOnStatusCode = 403;

  // Shared stop state
  let stopRequested = false;
  const activeControllers = new Set();

  // Paste URLs here one per line
  // Duplicates are allowed and will be processed as-is.
  const urlText = `

https://care.healthline.com/find-care/provider/dr-sudhaker-rao-1942378476
https://care.healthline.com/find-care/provider/dr-krishna-sawhney-1417052424
https://care.healthline.com/find-care/provider/dr-karen-park-1851499099
https://care.healthline.com/find-care/provider/dr-ghaus-malik-1497820138
https://care.healthline.com/find-care/provider/dr-olusegun-osinbowale-1114065547
https://care.healthline.com/find-care/provider/dr-syed-ahsan-1851568216
https://care.healthline.com/find-care/provider/dr-mohammad-alhyari-1346554912
https://care.healthline.com/find-care/provider/dr-neil-simmerman-1376704759
https://care.healthline.com/find-care/provider/dr-pete-janevski-1306909924
https://care.healthline.com/find-care/provider/dr-raed-alnajjar-1215107982
https://care.healthline.com/find-care/provider/dr-jyothsna-herek-1669676169
https://care.healthline.com/find-care/provider/dr-henry-lim-1710065842
https://care.healthline.com/find-care/provider/dr-john-corcoran-1053350603
https://care.healthline.com/find-care/provider/dr-claudio-schuger-1720179211
https://care.healthline.com/find-care/provider/dr-amit-mohindra-1427029453
https://care.healthline.com/find-care/provider/dr-frederic-sulak-1720156268


  `.trim();

  // -----------------------
  // Timing / Progress
  // -----------------------
  const startTime = Date.now();

  function formatDuration(ms) {
    if (!isFinite(ms) || ms < 0) return "--";

    const totalSeconds = Math.floor(ms / 1000);
    const hrs = Math.floor(totalSeconds / 3600);
    const mins = Math.floor((totalSeconds % 3600) / 60);
    const secs = totalSeconds % 60;

    if (hrs > 0) return `${hrs}h ${mins}m ${secs}s`;
    if (mins > 0) return `${mins}m ${secs}s`;
    return `${secs}s`;
  }

  function formatClockTime(ts) {
    if (!isFinite(ts)) return "--";
    return new Date(ts).toLocaleTimeString();
  }

  function updateProgress(done, total, currentUrl = "", note = "") {
    const pct = total ? Math.floor((done / total) * 100) : 0;
    const barSize = 30;
    const filled = Math.floor((pct / 100) * barSize);
    const bar = "█".repeat(filled) + "░".repeat(barSize - filled);

    const elapsedMs = Date.now() - startTime;
    const avgPerItemMs = done > 0 ? elapsedMs / done : 0;
    const remaining = Math.max(total - done, 0);
    const etaMs = done > 0 ? avgPerItemMs * remaining : 0;
    const finishTs = done > 0 ? Date.now() + etaMs : 0;

    console.clear();
    console.log(`Scraping Healthgrades (${done}/${total})`);
    console.log(`[${bar}] ${pct}%`);
    console.log(`Elapsed: ${formatDuration(elapsedMs)}`);
    console.log(`ETA: ${done > 0 ? formatDuration(etaMs) : "--"}`);
    console.log(`Estimated Finish: ${done > 0 ? formatClockTime(finishTs) : "--"}`);

    if (currentUrl) console.log(`Current: ${currentUrl}`);
    if (note) console.log(`Status: ${note}`);

    if (stopRequested) {
      console.log(`🛑 Stop requested because HTTP ${stopOnStatusCode} was found.`);
    }
  }

  // -----------------------
  // Utilities
  // -----------------------
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const clean = (s) => {
    return (s || "").replace(/\s+/g, " ").trim();
  };

  function normalizeUrl(u) {
    if (!u) return "";

    let url = u.trim();

    url = url.replace(/[?&]place-id=(?=&|$)/i, "");
    url = url.replace(/[?&]$/g, "");
    url = url.replace(/\?place-id$/i, "");
    url = url.replace(/^http:\/\//i, "https://");

    return url;
  }

  function sanitize(s) {
    if (!s) return "";
    return clean(String(s));
  }

  function requestStop() {
    stopRequested = true;

    for (const controller of activeControllers) {
      try {
        controller.abort();
      } catch {}
    }

    activeControllers.clear();
  }

  // -----------------------
  // NPI Extraction
  // -----------------------
  function extractNpisFromHtml(html) {
    const hits = new Set();
    let m;

    const reEscaped = /npi\\":\\"(\d{10})\\"/g;
    while ((m = reEscaped.exec(html)) !== null) {
      hits.add(m[1]);
    }

    const reJson = /"npi"\s*:\s*"(\d{10})"/gi;
    while ((m = reJson.exec(html)) !== null) {
      hits.add(m[1]);
    }

    const reNpiNumber = /"npiNumber"\s*:\s*"(\d{10})"/gi;
    while ((m = reNpiNumber.exec(html)) !== null) {
      hits.add(m[1]);
    }

    const reLoose = /npi[^0-9]{0,50}(\d{10})/gi;
    while ((m = reLoose.exec(html)) !== null) {
      hits.add(m[1]);
    }

    return [...hits];
  }

  // -----------------------
  // H1 Extraction
  // -----------------------
  function extractH1TextFromHtml(html) {
    try {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const h1 = doc.querySelector("h1");
      return sanitize(h1?.textContent || "");
    } catch {
      return "";
    }
  }

  // -----------------------
  // Strong Text Extraction
  // -----------------------
  function extractStrongUnavailableTextFromHtml(html) {
    try {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const strongs = [...doc.querySelectorAll("strong")];

      const targetText = "This page is not available in your area.";

      const found = strongs.find((el) => sanitize(el.textContent || "") === targetText);

      return found ? targetText : "";
    } catch {
      return "";
    }
  }

  // -----------------------
  // Fetch with retries
  // -----------------------
  async function fetchWithRetry(url, attempt = 0) {
    if (stopRequested) {
      throw new Error("STOP_REQUESTED");
    }

    const controller = new AbortController();
    activeControllers.add(controller);

    const timeout = setTimeout(() => {
      try {
        controller.abort();
      } catch {}
    }, 25000);

    try {
      const res = await fetch(url, {
        credentials: "include",
        signal: controller.signal,
        headers: {
          "User-Agent": navigator.userAgent,
          "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
          "Accept-Language": "en-US,en;q=0.9",
          "Cache-Control": "no-cache",
          "Pragma": "no-cache"
        }
      });

      // If 405 found, trigger global stop immediately.
      if (res.status === stopOnStatusCode) {
        requestStop();
        return res;
      }

      // Do not retry if stop was requested by another request.
      if (stopRequested) {
        throw new Error("STOP_REQUESTED");
      }

      if (!res.ok) {
        const retryable = [429, 500, 502, 503, 504].includes(res.status);

        if (retryable && attempt < maxRetries && !stopRequested) {
          const backoff = (attempt + 1) * 1200 + Math.floor(Math.random() * 500);
          await sleep(backoff);
          return fetchWithRetry(url, attempt + 1);
        }
      }

      return res;
    } finally {
      clearTimeout(timeout);
      activeControllers.delete(controller);
    }
  }

  // -----------------------
  // Build combined status/error value
  // -----------------------
  function buildStatusCodeError(res, npi) {
    const statusCode = String(res.status || "");

    if (!res.ok) {
      return statusCode;
    }

    if (!npi) {
      return `${statusCode} (Search page)`;
    }

    return statusCode;
  }

  // -----------------------
  // Scrape one URL
  // -----------------------
  async function scrapeOne(inputUrl) {
    const url = normalizeUrl(inputUrl);

    if (stopRequested) {
      return {
        URL: url,
        StatusCode_ErrorCode: "SKIPPED_STOP_REQUESTED",
        NPI: "",
        H1_Text: "",
        Redirect: "No",
        StopTriggered: "No",
        Strong_Text: ""
      };
    }

    await sleep(delayMs + Math.floor(Math.random() * 250));

    if (stopRequested) {
      return {
        URL: url,
        StatusCode_ErrorCode: "SKIPPED_STOP_REQUESTED",
        NPI: "",
        H1_Text: "",
        Redirect: "No",
        StopTriggered: "No",
        Strong_Text: ""
      };
    }

    try {
      const res = await fetchWithRetry(url);

      let html = "";
      try {
        html = await res.text();
      } catch {
        html = "";
      }

      const npis = extractNpisFromHtml(html);
      const npi = sanitize(npis[0] || "");
      const h1Text = extractH1TextFromHtml(html);
      const strongText = extractStrongUnavailableTextFromHtml(html);
      const redirect = res.redirected ? "Yes" : "No";
      const statusCodeError = buildStatusCodeError(res, npi);

      return {
        URL: url,
        StatusCode_ErrorCode: statusCodeError,
        NPI: npi,
        H1_Text: h1Text,
        Redirect: redirect,
        StopTriggered: res.status === stopOnStatusCode ? "Yes" : "No",
        Strong_Text: strongText
      };
    } catch (e) {
      let statusCodeError = "UNKNOWN_ERROR";

      if (e?.message === "STOP_REQUESTED") {
        statusCodeError = "SKIPPED_STOP_REQUESTED";
      } else if (e?.name === "AbortError") {
        statusCodeError = stopRequested ? "ABORTED_STOP_REQUESTED" : "TIMEOUT";
      } else if (e?.name) {
        statusCodeError = e.name.toUpperCase();
      } else if (e?.message) {
        statusCodeError = sanitize(e.message).slice(0, 100);
      }

      return {
        URL: url,
        StatusCode_ErrorCode: statusCodeError,
        NPI: "",
        H1_Text: "",
        Redirect: "No",
        StopTriggered: "No",
        Strong_Text: ""
      };
    }
  }

  // -----------------------
  // Batch runner
  // Keeps batch processing
  // Stops starting new batches once 405 is found
  // -----------------------
  async function runInBatches(urls, batchSize) {
    const results = [];
    let done = 0;

    for (let i = 0; i < urls.length; i += batchSize) {
      if (stopRequested) {
        console.warn(`🛑 Stopping before next batch because HTTP ${stopOnStatusCode} was encountered.`);
        break;
      }

      const batch = urls.slice(i, i + batchSize);

      updateProgress(
        done,
        urls.length,
        normalizeUrl(batch[0] || ""),
        `Starting batch ${Math.floor(i / batchSize) + 1}`
      );

      const batchResults = await Promise.all(
        batch.map(async (url) => {
          const normalizedUrl = normalizeUrl(url);

          if (stopRequested) {
            return {
              URL: normalizedUrl,
              StatusCode_ErrorCode: "SKIPPED_STOP_REQUESTED",
              NPI: "",
              H1_Text: "",
              Redirect: "No",
              StopTriggered: "No",
              Strong_Text: ""
            };
          }

          updateProgress(done, urls.length, normalizedUrl, "Working...");

          const r = await scrapeOne(url);

          done++;

          const note = `StatusCode/ErrorCode: ${r.StatusCode_ErrorCode} | Redirect: ${r.Redirect}`;
          updateProgress(done, urls.length, r.URL, note);

          if (r.StopTriggered === "Yes") {
            console.warn(`🛑 HTTP ${stopOnStatusCode} found at URL: ${r.URL}`);
          }

          return r;
        })
      );

      // Keep only meaningful attempted/stopped rows.
      // If you want skipped rows also included, remove this filter.
      const filteredBatchResults = batchResults.filter(
        (r) => r.StatusCode_ErrorCode !== "SKIPPED_STOP_REQUESTED"
      );

      results.push(...filteredBatchResults);

      if (batchResults.some((r) => r.StopTriggered === "Yes")) {
        console.warn(`🛑 Stopping after current batch because HTTP ${stopOnStatusCode} was encountered.`);
        break;
      }

      await sleep(350);
    }

    return results;
  }

  // -----------------------
  // Build URL list
  // -----------------------
  // IMPORTANT:
  // Duplicates are intentionally preserved.
  // No Set() is used here.
  const urls = urlText
    .split(/\n+/)
    .map((s) => s.trim())
    .filter(Boolean)
    .map(normalizeUrl);

  if (!urls.length) {
    console.warn("No URLs found in urlText.");
    return [];
  }

  // -----------------------
  // Run
  // -----------------------
  updateProgress(0, urls.length, "", "Starting...");
  const results = await runInBatches(urls, batchSize);

  // -----------------------
  // CSV export
  // -----------------------
  const cols = [
    "URL",
    "StatusCode_ErrorCode",
    "NPI",
    "H1_Text",
    "Redirect",
    "StopTriggered",
    "Strong_Text"
  ];

  const csv = [
    cols.join(","),
    ...results.map((r) =>
      cols
        .map((c) => `"${String(r[c] ?? "").replace(/"/g, '""')}"`)
        .join(",")
    )
  ].join("\n");

  let copied = false;

  try {
    if (typeof copy === "function") {
      copy(csv);
      copied = true;
      console.log("📋 CSV copied to clipboard");
    }
  } catch {}

  if (!copied) {
    const blob = new Blob([csv], {
      type: "text/csv;charset=utf-8"
    });

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();

    console.log("⬇️ CSV downloaded:", fileName);
  }

  const totalElapsed = Date.now() - startTime;

  console.clear();
  console.log("🎉 DONE — Results:");
  console.log(`Total Time: ${formatDuration(totalElapsed)}`);

  if (results.some((r) => r.StopTriggered === "Yes")) {
    console.log(`🛑 Script stopped early because HTTP ${stopOnStatusCode} was encountered.`);
  }

  console.table(results);

  return results;
})();

Sub ProgressBar(ByVal currentStep As Long, ByVal totalSteps As Long, ByVal message As String)

    Dim pct As Double
    Dim filledBars As Long
    Dim emptyBars As Long
    Dim barText As String

    If totalSteps = 0 Then totalSteps = 1

    pct = currentStep / totalSteps

    If pct < 0 Then pct = 0
    If pct > 1 Then pct = 1

    filledBars = CLng(pct * 30)
    emptyBars = 30 - filledBars

    barText = String(filledBars, "#") & String(emptyBars, "-")

    Application.StatusBar = message & "  [" & barText & "] " & Format(pct, "0%")
    DoEvents

End Sub

Function NormalizeText(ByVal value As Variant) As String

    Dim s As String

    If IsError(value) Then
        NormalizeText = ""
        Exit Function
    End If

    s = CStr(value)
    s = Replace(s, vbCr, "")
    s = Replace(s, vbLf, "")
    s = Application.WorksheetFunction.Clean(s)
    s = Trim(s)

    NormalizeText = LCase(s)

End Function

Function GetHeaderColumn(ws As Worksheet, headerName As String) As Long

    Dim lastCol As Long
    Dim c As Long

    lastCol = ws.Cells(1, ws.Columns.Count).End(xlToLeft).Column

    For c = 1 To lastCol
        If NormalizeText(ws.Cells(1, c).value) = NormalizeText(headerName) Then
            GetHeaderColumn = c
            Exit Function
        End If
    Next c

    Err.Raise vbObjectError + 1001, , "Header '" & headerName & "' not found in sheet '" & ws.Name & "'."

End Function

Function LastRowByColumn(ws As Worksheet, colNum As Long) As Long

    LastRowByColumn = ws.Cells(ws.Rows.Count, colNum).End(xlUp).Row

End Function

Sub CreateOrClearSheet(sheetName As String)

    Dim ws As Worksheet

    On Error Resume Next
    Set ws = ThisWorkbook.Sheets(sheetName)
    On Error GoTo 0

    If ws Is Nothing Then
        Set ws = ThisWorkbook.Sheets.Add(After:=ThisWorkbook.Sheets(ThisWorkbook.Sheets.Count))
        ws.Name = sheetName
    Else
        If ws.AutoFilterMode Then ws.AutoFilterMode = False
        ws.Cells.Clear
        ws.Cells.FormatConditions.Delete
    End If

End Sub

Sub DeleteSheetIfExists(sheetName As String)

    Dim ws As Worksheet

    On Error Resume Next
    Set ws = ThisWorkbook.Sheets(sheetName)
    On Error GoTo 0

    If Not ws Is Nothing Then
        Application.DisplayAlerts = False
        ws.Delete
        Application.DisplayAlerts = oldDisplayAlerts
    End If

End Sub

Sub CopyGoogleDataToNewSheet()

    Dim wsSource As Worksheet
    Dim wsTarget As Worksheet
    Dim lastRow As Long
    Dim i As Long
    Dim targetRow As Long
    Dim newSheetName As String

    Dim sourceCol As Long
    Dim placeIdCol As Long
    Dim placeIdTargetCol As Long

    Dim candidateCols As Variant
    Dim colMap As Object
    Dim colList As Collection
    Dim v As Variant
    Dim srcCol As Long
    Dim headerText As String
    Dim targetCol As Long

    Set wsSource = ThisWorkbook.Sheets("Sheet1")

    sourceCol = GetHeaderColumn(wsSource, SOURCE_HEADER)
    placeIdCol = GetHeaderColumn(wsSource, PLACE_ID_HEADER)

    lastRow = LastRowByColumn(wsSource, sourceCol)

    newSheetName = "Place ID_" & wsSource.Name

    Call CreateOrClearSheet(newSheetName)
    Set wsTarget = ThisWorkbook.Sheets(newSheetName)

    Set colMap = CreateObject("Scripting.Dictionary")
    Set colList = New Collection

    candidateCols = Array(2, 7, 14, 15, sourceCol, placeIdCol)

    For Each v In candidateCols

        srcCol = CLng(v)
        headerText = NormalizeText(wsSource.Cells(1, srcCol).value)

        If headerText <> "modified_time" Then

            If Not colMap.Exists(CStr(srcCol)) Then
                colList.Add srcCol
                colMap.Add CStr(srcCol), colList.Count
            End If

            If srcCol = placeIdCol Then
                placeIdTargetCol = CLng(colMap(CStr(srcCol)))
            End If

        End If

    Next v

    If placeIdTargetCol = 0 Then
        Err.Raise vbObjectError + 1002, , "PLACE_ID column was not copied. Please check the PLACE_ID header."
    End If

    For targetCol = 1 To colList.Count
        srcCol = CLng(colList(targetCol))
        wsTarget.Cells(1, targetCol).value = wsSource.Cells(1, srcCol).value
    Next targetCol

    targetRow = 2

    For i = 2 To lastRow

        If NormalizeText(wsSource.Cells(i, sourceCol).value) = "google" Then

            For targetCol = 1 To colList.Count
                srcCol = CLng(colList(targetCol))
                wsTarget.Cells(targetRow, targetCol).value = wsSource.Cells(i, srcCol).value
            Next targetCol

            targetRow = targetRow + 1

        End If

        If i Mod 500 = 0 Then
            ProgressBar 5 + ((i / lastRow) * 10), 100, "Copying Google data..."
        End If

    Next i

    wsTarget.Columns.AutoFit

    If targetRow > 2 Then
        Call HighlightDuplicateColumn(wsTarget, placeIdTargetCol, 2)
    End If

End Sub

Sub HighlightDuplicateColumn(ws As Worksheet, colNum As Long, startRow As Long)

    Dim lastRow As Long
    Dim rng As Range

    lastRow = ws.Cells(ws.Rows.Count, colNum).End(xlUp).Row

    If lastRow >= startRow Then

        Set rng = ws.Range(ws.Cells(startRow, colNum), ws.Cells(lastRow, colNum))
        rng.FormatConditions.Delete

        With rng.FormatConditions.AddUniqueValues
            .DupeUnique = xlDuplicate
            .Font.Color = -16383844
            .Interior.Color = 13551615
        End With

        rng.FormatConditions(rng.FormatConditions.Count).SetFirstPriority

    End If

End Sub

Sub BuildComparisonSheet(sheetName As String, firstSource As String, secondSource As String, missingFirstHeader As String, missingSecondHeader As String, duplicateFirstHeader As String, duplicateSecondHeader As String)

    Dim wsSource As Worksheet
    Dim wsTarget As Worksheet
    Dim lastRow As Long
    Dim sourceCol As Long

    Set wsSource = ThisWorkbook.Sheets("Sheet1")

    sourceCol = GetHeaderColumn(wsSource, SOURCE_HEADER)
    lastRow = LastRowByColumn(wsSource, sourceCol)

    Call CreateOrClearSheet(sheetName)
    Set wsTarget = ThisWorkbook.Sheets(sheetName)

    wsTarget.Cells(1, "A").value = firstSource
    wsTarget.Cells(1, "B").value = secondSource
    wsTarget.Cells(1, "C").value = "Difference"
    wsTarget.Cells(1, "D").value = missingFirstHeader
    wsTarget.Cells(1, "E").value = missingSecondHeader

    Call CopySourceValuesToColumn(wsSource, wsTarget, firstSource, 1, sourceCol, lastRow)
    Call CopySourceValuesToColumn(wsSource, wsTarget, secondSource, 2, sourceCol, lastRow)

    Call FillMissingColumns(wsTarget, 1, 2, 4, 5)

    If duplicateFirstHeader <> "" Then
        wsTarget.Cells(1, "F").value = duplicateFirstHeader
        Call FillDuplicateValuesFromColumn(wsTarget, 1, 6)
        Call HighlightDuplicateColumn(wsTarget, 6, 2)
    End If

    If duplicateSecondHeader <> "" Then
        wsTarget.Cells(1, "G").value = duplicateSecondHeader
        Call FillDuplicateValuesFromColumn(wsTarget, 2, 7)
        Call HighlightDuplicateColumn(wsTarget, 7, 2)
    End If

    Call HighlightComparisonDuplicates(wsTarget)

    wsTarget.Columns.AutoFit

End Sub

Sub CopySourceValuesToColumn(wsSource As Worksheet, wsTarget As Worksheet, sourceName As String, targetColumn As Long, sourceCol As Long, lastRow As Long)

    Dim i As Long
    Dim destRow As Long

    destRow = 2

    For i = 2 To lastRow

        If NormalizeText(wsSource.Cells(i, sourceCol).value) = NormalizeText(sourceName) Then
            wsTarget.Cells(destRow, targetColumn).value = wsSource.Cells(i, "B").value
            destRow = destRow + 1
        End If

        If i Mod 1000 = 0 Then DoEvents

    Next i

End Sub

Sub FillMissingColumns(ws As Worksheet, firstCol As Long, secondCol As Long, missingFirstCol As Long, missingSecondCol As Long)

    Dim dictFirst As Object
    Dim dictSecond As Object
    Dim outputDict As Object

    Dim lastFirst As Long
    Dim lastSecond As Long
    Dim i As Long
    Dim destRow As Long
    Dim val As String
    Dim displayVal As Variant

    Set dictFirst = CreateObject("Scripting.Dictionary")
    Set dictSecond = CreateObject("Scripting.Dictionary")

    lastFirst = ws.Cells(ws.Rows.Count, firstCol).End(xlUp).Row
    lastSecond = ws.Cells(ws.Rows.Count, secondCol).End(xlUp).Row

    For i = 2 To lastFirst
        val = NormalizeText(ws.Cells(i, firstCol).value)
        If val <> "" Then
            If Not dictFirst.Exists(val) Then dictFirst.Add val, ws.Cells(i, firstCol).value
        End If
    Next i

    For i = 2 To lastSecond
        val = NormalizeText(ws.Cells(i, secondCol).value)
        If val <> "" Then
            If Not dictSecond.Exists(val) Then dictSecond.Add val, ws.Cells(i, secondCol).value
        End If
    Next i

    Set outputDict = CreateObject("Scripting.Dictionary")
    destRow = 2

    For i = 2 To lastSecond

        val = NormalizeText(ws.Cells(i, secondCol).value)
        displayVal = ws.Cells(i, secondCol).value

        If val <> "" Then
            If Not dictFirst.Exists(val) Then
                If Not outputDict.Exists(val) Then
                    ws.Cells(destRow, missingFirstCol).value = displayVal
                    outputDict.Add val, True
                    destRow = destRow + 1
                End If
            End If
        End If

    Next i

    Set outputDict = CreateObject("Scripting.Dictionary")
    destRow = 2

    For i = 2 To lastFirst

        val = NormalizeText(ws.Cells(i, firstCol).value)
        displayVal = ws.Cells(i, firstCol).value

        If val <> "" Then
            If Not dictSecond.Exists(val) Then
                If Not outputDict.Exists(val) Then
                    ws.Cells(destRow, missingSecondCol).value = displayVal
                    outputDict.Add val, True
                    destRow = destRow + 1
                End If
            End If
        End If

    Next i

End Sub

Sub FillDuplicateValuesFromColumn(ws As Worksheet, sourceCol As Long, targetCol As Long)

    Dim dictCount As Object
    Dim dictOutput As Object
    Dim lastRow As Long
    Dim i As Long
    Dim destRow As Long
    Dim val As String
    Dim displayVal As Variant

    Set dictCount = CreateObject("Scripting.Dictionary")
    Set dictOutput = CreateObject("Scripting.Dictionary")

    lastRow = ws.Cells(ws.Rows.Count, sourceCol).End(xlUp).Row

    For i = 2 To lastRow
        val = NormalizeText(ws.Cells(i, sourceCol).value)

        If val <> "" Then
            If Not dictCount.Exists(val) Then
                dictCount.Add val, 1
            Else
                dictCount(val) = dictCount(val) + 1
            End If
        End If
    Next i

    destRow = 2

    For i = 2 To lastRow
        val = NormalizeText(ws.Cells(i, sourceCol).value)
        displayVal = ws.Cells(i, sourceCol).value

        If val <> "" Then
            If dictCount.Exists(val) Then
                If dictCount(val) > 1 Then
                    If Not dictOutput.Exists(val) Then
                        ws.Cells(destRow, targetCol).value = displayVal
                        dictOutput.Add val, True
                        destRow = destRow + 1
                    End If
                End If
            End If
        End If
    Next i

End Sub

Sub Docspot_Combined_Compared()

    Dim ws As Worksheet
    Dim newWs As Worksheet
    Dim lastRow As Long
    Dim i As Long
    Dim destRow As Long
    Dim dupDestRow As Long
    Dim dictAll As Object
    Dim dictDocspot As Object
    Dim dictDocspotCount As Object
    Dim dictDupOutput As Object
    Dim val As String
    Dim key As Variant
    Dim sourceCol As Long
    Dim lastRowA As Long

    Set ws = ThisWorkbook.Sheets("Sheet1")
    sourceCol = GetHeaderColumn(ws, SOURCE_HEADER)

    lastRow = Application.WorksheetFunction.Max( _
        ws.Cells(ws.Rows.Count, "B").End(xlUp).Row, _
        ws.Cells(ws.Rows.Count, sourceCol).End(xlUp).Row _
    )

    Call DeleteSheetIfExists("Missing DS")
    Call DeleteSheetIfExists("DUP DP")

    Call CreateOrClearSheet("docspot")
    Set newWs = ThisWorkbook.Sheets("docspot")

    Set dictAll = CreateObject("Scripting.Dictionary")
    Set dictDocspot = CreateObject("Scripting.Dictionary")
    Set dictDocspotCount = CreateObject("Scripting.Dictionary")
    Set dictDupOutput = CreateObject("Scripting.Dictionary")

    For i = 2 To lastRow

        val = Trim(CStr(ws.Cells(i, "B").value))

        If val <> "" Then
            If Not dictAll.Exists(val) Then dictAll.Add val, 1
        End If

        If NormalizeText(ws.Cells(i, sourceCol).value) = "docspot" Then

            If val <> "" Then

                If Not dictDocspot.Exists(val) Then dictDocspot.Add val, 1

                If Not dictDocspotCount.Exists(val) Then
                    dictDocspotCount.Add val, 1
                Else
                    dictDocspotCount(val) = dictDocspotCount(val) + 1
                End If

            End If

        End If

        If i Mod 1000 = 0 Then DoEvents

    Next i

    newWs.Cells(1, "A").value = "Unique DS Values"
    newWs.Cells(1, "B").value = "Docspot Values from Sheet1 Column B"
    newWs.Cells(1, "C").value = "Comparison"
    newWs.Cells(1, "D").value = "Missing Docspot"
    newWs.Cells(1, "E").value = "DUP DP"

    i = 2

    For Each key In dictAll.Keys
        newWs.Cells(i, "A").value = key
        i = i + 1
    Next key

    destRow = 2

    For Each key In dictDocspot.Keys
        newWs.Cells(destRow, "B").value = key
        destRow = destRow + 1
    Next key

    lastRowA = newWs.Cells(newWs.Rows.Count, "A").End(xlUp).Row
    destRow = 2

    For i = 2 To lastRowA

        val = Trim(CStr(newWs.Cells(i, "A").value))

        If dictDocspot.Exists(val) Then
            newWs.Cells(i, "C").value = "Match"
        Else
            newWs.Cells(i, "C").value = "No Match"
            newWs.Cells(destRow, "D").value = val
            destRow = destRow + 1
        End If

    Next i

    dupDestRow = 2

    For Each key In dictDocspotCount.Keys

        If dictDocspotCount(key) > 1 Then
            If Not dictDupOutput.Exists(key) Then
                newWs.Cells(dupDestRow, "E").value = key
                dictDupOutput.Add key, True
                dupDestRow = dupDestRow + 1
            End If
        End If

    Next key

    If dupDestRow > 2 Then
        Call HighlightDuplicateColumn(newWs, 5, 2)
    End If

    newWs.Columns.AutoFit

End Sub

Function ExtractFirstNumberFromText(ByVal inputText As String) As String

    Dim re As Object
    Dim matches As Object

    Set re = CreateObject("VBScript.RegExp")

    With re
        .Pattern = "\d+"
        .Global = False
        .IgnoreCase = True
    End With

    If re.Test(inputText) Then
        Set matches = re.Execute(inputText)
        ExtractFirstNumberFromText = matches(0).value
    Else
        ExtractFirstNumberFromText = ""
    End If

End Function

function retryDelay(n,h){var sd=retryAfter(h),d=NPI_CONFIG.retryBaseDelay*Math.pow(2,n-1)+rnd(1000,5000);if(sd!==null&&sd>d){d=sd+rnd(1000,5000);}return Math.min(d,NPI_CONFIG.maximumRetryDelay);}
function normalDelay(){var n=parseInt(e.delaySelector.value,10),x;if(n<=1000){x=2000;}else if(n<=2000){x=4000;}else if(n<=3000){x=6000;}else if(n<=5000){x=10000;}else if(n<=8000){x=15000;}else if(n<=15000){x=25000;}else if(n<=30000){x=45000;}else{x=90000;}return rnd(n,x);}
function fetchURL(url,cb){var x=new XMLHttpRequest(),done=false;function finish(err,res){if(done){return;}done=true;s.currentXHR=null;cb(err,res);}try{x.open("GET",url,true);x.timeout=NPI_CONFIG.requestTimeout;x.onreadystatechange=function(){var h=null;if(x.readyState!==4||done){return;}try{h=x.getResponseHeader("Retry-After");}catch(ignore){h=null;}finish(null,{status:x.status,html:x.responseText||"",retryAfter:h});};x.onerror=function(){finish(new Error("Network or CORS request failure"),null);};x.ontimeout=function(){finish(new Error("Request timed out after "+NPI_CONFIG.requestTimeout+" ms"),null);};x.onabort=function(){finish(new Error("Request aborted"),null);};s.currentXHR=x;x.send(null);}catch(err){finish(err,null);}}
function save(i,o,r,n,c,t){s.results[i]={url:o,requestedUrl:r,npi:n,statusCode:c,status:t};} function complete(){s.completed++;s.currentIndex++;progress();}
function next(){if(!s.running||s.stopped){return;}if(s.paused){status("Paused");return;}current(0);}
function current(retry){var i,o,r;if(!s.running||s.stopped){return;}if(s.paused){status("Paused");return;}if(s.currentIndex>=urls.length){finish(false);return;}if(s.total429>=NPI_CONFIG.maximumTotal429){finish(true);return;}i=s.currentIndex;o=urls[i];r=normalize(o);status((retry?"Retry "+retry+" for":"Requesting")+" item "+(i+1)+" of "+urls.length);fetchURL(r,function(err,res){handle(i,o,r,retry,err,res);});}
function handle(i,o,r,retry,err,res){var max=parseInt(e.retrySelector.value,10),n,d;if(!s.running||s.stopped){return;}if(err){s.errors++;save(i,o,r,"",0,err.message);complete();if(s.currentIndex>=urls.length){finish(false);return;}d=normalDelay();status("Request failed. Waiting "+duration(d)+" before continuing.");schedule(next,d);return;}if(res.status>=200&&res.status<300){s.consecutive429=0;n=extract(res.html);if(n){s.found++;save(i,o,r,n,res.status,"Found");}else{s.notFound++;save(i,o,r,"",res.status,"NPI not found");}complete();if(s.currentIndex>=urls.length){finish(false);return;}d=normalDelay();status("Processed item "+(i+1)+". HTTP "+res.status+". Waiting "+duration(d)+".");schedule(next,d);return;}if(res.status===429){s.total429++;s.consecutive429++;stats();if(retry<max&&s.total429<NPI_CONFIG.maximumTotal429){d=retryDelay(retry+1,res.retryAfter);if(s.consecutive429>=NPI_CONFIG.consecutive429Limit){d=Math.max(d,NPI_CONFIG.cooldownDelay);s.consecutive429=0;}status("HTTP 429 received. Waiting "+duration(d)+" before retrying.");schedule(function(){current(retry+1);},d);return;}s.errors++;save(i,o,r,"",429,"HTTP 429: retry limit reached");complete();if(s.total429>=NPI_CONFIG.maximumTotal429){finish(true);return;}if(s.currentIndex>=urls.length){finish(false);return;}schedule(next,NPI_CONFIG.cooldownDelay);return;}if(res.status>=500&&res.status<=599&&retry<max){d=retryDelay(retry+1,res.retryAfter);status("HTTP "+res.status+". Waiting "+duration(d)+" before retrying.");schedule(function(){current(retry+1);},d);return;}s.errors++;save(i,o,r,"",res.status,"HTTP "+res.status);complete();if(s.currentIndex>=urls.length){finish(false);return;}d=normalDelay();status("HTTP "+res.status+". Waiting "+duration(d)+".");schedule(next,d);}
function reset(){clearTask();s.running=false;s.paused=false;s.stopped=false;s.currentIndex=0;s.completed=0;s.found=0;s.notFound=0;s.errors=0;s.total429=0;s.consecutive429=0;s.currentXHR=null;s.results=new Array(urls.length);e.progressFill.style.width="0%";e.downloadButton.disabled=true;text(e.pauseButton,"Pause");progress();}
function start(){if(s.running){return;}reset();if(!urls.length){status("The URL list is empty.");return;}s.running=true;controls(true);status("Starting first request...");schedule(next,1000);}
function pause(){if(!s.running){return;}if(!s.paused){s.paused=true;clearTask();text(e.pauseButton,"Resume");status("Paused. An active request may still finish.");}else{s.paused=false;text(e.pauseButton,"Pause");status("Resuming...");schedule(next,500);}}
function stop(){if(!s.running){return;}s.stopped=true;s.running=false;clearTask();if(s.currentXHR){try{s.currentXHR.abort();}catch(ignore){s.currentXHR=null;}s.currentXHR=null;}controls(false);e.pauseButton.disabled=true;e.stopButton.disabled=true;e.downloadButton.disabled=s.completed===0;text(e.startButton,"Start Again");status("Stopped. Partial results can be downloaded.");}
function csvValue(v){return String(v===null||typeof v==="undefined"?"":v).replace(/"/g,'""');}
function download(data){var rows=[["URL","Requested URL","NPI","Status Code","Status"].join(",")],i,a,c,b,l,u,name;for(i=0;i<data.length;i++){a=data[i];if(a){rows.push('"'+csvValue(a.url)+'","'+csvValue(a.requestedUrl)+'","'+csvValue(a.npi)+'","'+csvValue(a.statusCode)+'","'+csvValue(a.status)+'"');}}if(rows.length===1){status("No CSV results are available to download.");return;}c="\uFEFF"+rows.join("\r\n");b=new Blob([c],{type:"text/csv;charset=utf-8"});name="webmd_npi_data_"+(new Date().getTime())+".csv";if(window.navigator&&window.navigator.msSaveBlob){window.navigator.msSaveBlob(b,name);status("CSV downloaded: "+name);return;}u=window.URL.createObjectURL(b);l=document.createElement("a");l.href=u;l.download=name;l.style.display="none";document.body.appendChild(l);l.click();status("CSV download started: "+name);setTimeout(function(){if(l.parentNode){l.parentNode.removeChild(l);}window.URL.revokeObjectURL(u);},30000);}
function finish(limited){s.running=false;s.paused=false;clearTask();controls(false);e.pauseButton.disabled=true;e.stopButton.disabled=true;e.downloadButton.disabled=s.completed===0;text(e.startButton,"Run Again");progress();status(limited?"Stopped after repeated HTTP 429 responses. Preparing partial CSV...":"Completed. Preparing CSV download...");if(s.completed>0){setTimeout(function(){download(s.results);},500);}else{status("Finished, but no completed results are available.");}}
e.startButton.onclick=start;e.pauseButton.onclick=pause;e.stopButton.onclick=stop;e.downloadButton.onclick=function(){download(s.results);};
}());
  </script>
  <script>
    const modal=document.getElementById('code-modal'),editor=document.getElementById('code-editor'),editButton=document.getElementById('edit-button'),copyButton=document.getElementById('copy-button'),closeButton=document.getElementById('close-button'),modeLabel=document.getElementById('mode-label'),toast=document.getElementById('toast');
    let toastTimer,lastCodeButton=null;
    function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
    function openModal(button){const sourceElement=document.getElementById(button.dataset.source);if(!sourceElement)return;lastCodeButton=button;editor.value=sourceElement.textContent.trim();editor.readOnly=true;document.getElementById('modal-title').textContent=button.dataset.title;editor.setAttribute('aria-label',button.dataset.title+' code');editButton.textContent='Edit';modeLabel.textContent='View mode';modeLabel.classList.remove('editing');modal.classList.add('open');document.body.style.overflow='hidden';closeButton.focus()}
    function closeModal(){modal.classList.remove('open');document.body.style.overflow='';if(lastCodeButton)lastCodeButton.focus()}
    document.querySelectorAll('.code-row').forEach(button=>button.addEventListener('click',()=>openModal(button)));closeButton.addEventListener('click',closeModal);
    editButton.addEventListener('click',()=>{editor.readOnly=!editor.readOnly;if(editor.readOnly){editButton.textContent='Edit';modeLabel.textContent='View mode';modeLabel.classList.remove('editing');showToast('Editing finished')}else{editButton.textContent='Done';modeLabel.textContent='Editing enabled';modeLabel.classList.add('editing');editor.focus()}});
    copyButton.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(editor.value);showToast('Code copied')}catch(error){editor.focus();editor.select();showToast(document.execCommand('copy')?'Code copied':'Copy failed')}});
    modal.addEventListener('click',event=>{if(event.target===modal)closeModal()});
    editor.addEventListener('keydown',event=>{if(event.key==='Tab'&&!editor.readOnly){event.preventDefault();const start=editor.selectionStart,end=editor.selectionEnd;editor.value=editor.value.substring(0,start)+'  '+editor.value.substring(end);editor.selectionStart=editor.selectionEnd=start+2}});

    const messageModal=document.getElementById('message-modal'),messageDialog=document.getElementById('message-dialog'),messageTitle=document.getElementById('message-modal-title'),messageText=document.getElementById('message-modal-text'),messageIcon=document.getElementById('message-dialog-icon'),messageCloseButton=document.getElementById('message-modal-close');

    // Edit these card-specific popup messages when needed.
    const popupMessages={
      h1:{
        info:{title:'Extract H1 Information',message:'Extracts the page title and first H1 from a list of URLs, with progress tracking, copy, and CSV export.'},
        caution:{title:'Extract H1 Caution',message:'Some websites may block browser fetch requests because of CORS, login requirements, CAPTCHA, or network policy.'}
      },
      hg:{
        info:{title:'Healthgrades NPI Extractor Information',message:'Processes the provider URLs contained in the script and exports NPI, H1, status, redirect, stop-trigger, and availability details.'},
        caution:{title:'Healthgrades NPI Extractor Caution',message:'The script intentionally stops when HTTP 403 is detected. Large batches may also be rate-limited or blocked by the website.'}
      },
      npi:{
        info:{title:'Generate NPI Details Information',message:'Looks up the NPIs contained in the script and downloads the results as a CSV file.'},
        caution:{title:'Generate NPI Details Caution',message:'Run this only where browser requests to the NPI Registry API are allowed. Verify the exported provider details before using them.'}
      },
      excelDump:{
        info:{title:'Excel Dump VBA Information',message:'Runs the complete Excel dump process from the Main macro, including comparison sheets, missing and duplicate checks, harvester counts, source URL extraction, scope checks, and status-bar progress.'},
        caution:{title:'Excel Dump VBA Caution',message:'The workbook must contain Sheet1 and the required SOURCE_NAME, PLACE_ID, ENTITY_ID, PRODUCT_ID, and URL headers. '}
      },
      webmdNpi:{
        info:{title:'Vitals / WebMD NPI Extractor Information',message:'Accepts WebMD provider URLs, extracts available NPI numbers, displays request progress, handles HTTP 429 backoff, and downloads CSV results.'},
        caution:{title:'Vitals / WebMD NPI Extractor Caution',message:'WebMD may block browser requests through CORS, rate limiting, CAPTCHA, or access controls. Use a longer interval after repeated HTTP 429 responses and verify every extracted NPI.'}
      }
    };

    let lastMessageButton=null;
    function openMessagePopup(type,clickedButton){const content=popupMessages[clickedButton.dataset.card]?.[type];if(!content)return;lastMessageButton=clickedButton;messageDialog.classList.remove('info','caution');messageDialog.classList.add(type);messageTitle.textContent=content.title;messageText.textContent=content.message;messageIcon.textContent=type==='info'?'i':'!';messageModal.classList.add('open');document.body.style.overflow='hidden';messageCloseButton.focus()}
    function closeMessagePopup(){messageModal.classList.remove('open');document.body.style.overflow='';if(lastMessageButton)lastMessageButton.focus()}
    document.querySelectorAll('.message-icon').forEach(button=>{
      function activate(event){event.preventDefault();event.stopPropagation();openMessagePopup(button.dataset.messageType,button)}
      button.addEventListener('click',activate);
      button.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){activate(event)}});
    });
    messageCloseButton.addEventListener('click',closeMessagePopup);
    messageModal.addEventListener('click',event=>{if(event.target===messageModal)closeMessagePopup()});
    document.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(messageModal.classList.contains('open'))closeMessagePopup();else if(modal.classList.contains('open'))closeModal()});
  </script>
