<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reusable JavaScript tools and code snippets.">
  <title>Code Library</title>
  <style>
    :root{--bg:#f4f7fb;--surface:#fff;--text:#172033;--muted:#667085;--primary:#2563eb;--primary-dark:#1d4ed8;--border:#e3e8ef;--danger:#dc2626;--shadow:0 18px 45px rgba(20,35,65,.14)}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;padding:40px 20px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at top left,rgba(37,99,235,.14),transparent 32%),radial-gradient(circle at bottom right,rgba(124,58,237,.10),transparent 30%),var(--bg)}
    button{font:inherit}.page{width:min(1050px,100%);margin:auto}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}.eyebrow{margin-bottom:9px;color:var(--primary);font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,5vw,3.2rem);line-height:1.08;letter-spacing:-.045em}.subtitle{margin:12px 0 0;color:var(--muted);line-height:1.6}.back{flex:none;padding:10px 15px;border:1px solid var(--border);border-radius:12px;color:var(--text);background:#fff;text-decoration:none;font-weight:750;box-shadow:0 7px 18px rgba(20,35,65,.07)}
    .library{padding:24px;border:1px solid rgba(227,232,239,.95);border-radius:24px;background:rgba(255,255,255,.94);box-shadow:var(--shadow)}.library-head{display:grid;grid-template-columns:minmax(190px,.7fr) 1.5fr 42px;gap:20px;padding:0 18px 12px;color:#8790a2;font-size:.75rem;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.code-row{width:100%;display:grid;grid-template-columns:minmax(190px,.7fr) 1.5fr 42px;align-items:center;gap:20px;padding:19px 18px;border:1px solid var(--border);border-radius:16px;color:inherit;background:#fff;text-align:left;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}.code-row:hover,.code-row:focus-visible{transform:translateY(-2px);border-color:rgba(37,99,235,.42);box-shadow:0 12px 25px rgba(37,99,235,.12);outline:none}.code-name{font-weight:850}.code-description{color:var(--muted);line-height:1.5}.arrow{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;color:var(--primary);background:#eaf1ff;font-size:1.15rem;font-weight:900}.empty-note{margin:18px 4px 0;color:var(--muted);font-size:.84rem}
    .modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(15,23,42,.58);backdrop-filter:blur(6px)}.modal.open{display:flex}.dialog{width:min(1000px,100%);max-height:calc(100vh - 44px);display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.25);border-radius:22px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.3)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--border)}.dialog-title{margin:0;font-size:1.15rem}.dialog-actions{display:flex;gap:8px;flex-wrap:wrap}.action{padding:9px 13px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);font-weight:750;cursor:pointer}.action:hover{background:#f7f9fc}.copy{color:#fff;background:var(--primary);border-color:var(--primary)}.copy:hover{background:var(--primary-dark)}.close{color:var(--danger)}.editor-wrap{min-height:0;flex:1;padding:16px;background:#0f172a}.editor{width:100%;height:min(70vh,690px);display:block;resize:none;padding:17px;border:0;border-radius:13px;outline:none;background:#111827;color:#e5e7eb;font:13px/1.55 Consolas,"Courier New",monospace;tab-size:2;white-space:pre}.editor[readonly]{cursor:text}.dialog-foot{display:flex;justify-content:space-between;gap:15px;padding:11px 20px;color:var(--muted);background:#fff;font-size:.8rem}.editing{color:#b45309;font-weight:800}
    .toast{position:fixed;left:50%;bottom:25px;z-index:10000;transform:translate(-50%,20px);padding:11px 16px;border-radius:11px;color:#fff;background:#172033;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}
    @media(max-width:680px){body{padding:26px 14px}.topbar{flex-direction:column}.library{padding:15px}.library-head{display:none}.code-row{grid-template-columns:1fr 38px;gap:8px}.code-description{grid-column:1/2}.arrow{grid-column:2;grid-row:1/3}.dialog-head{align-items:flex-start;flex-direction:column}.dialog-actions{width:100%}.action{flex:1}.editor-wrap{padding:10px}.editor{height:66vh}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div><div class="eyebrow">Reusable Tools</div><h1>Code Library</h1><p class="subtitle">Click a row to view, edit, and copy its code.</p></div>
      <a class="back" href="index.html">← Dashboard</a>
    </header>
    <section class="library" aria-label="Code snippets">
      <div class="library-head"><span>Name</span><span>Description</span><span></span></div>
      <button class="code-row" id="open-extract-h1" type="button">
        <span class="code-name">Extract &lt;H1&gt;</span>
        <span class="code-description">Extract page titles and H1 headings from multiple URLs, with worker controls, progress, copy, and CSV download.</span>
        <span class="arrow" aria-hidden="true">›</span>
      </button>
      <p class="empty-note">Add your future snippets as additional rows below this card.</p>
    </section>
  </main>

  <div class="modal" id="code-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <section class="dialog">
      <header class="dialog-head">
        <h2 class="dialog-title" id="modal-title">Extract &lt;H1&gt;</h2>
        <div class="dialog-actions">
          <button class="action" id="edit-button" type="button">Edit</button>
          <button class="action copy" id="copy-button" type="button">Copy</button>
          <button class="action close" id="close-button" type="button">Close</button>
        </div>
      </header>
      <div class="editor-wrap"><textarea class="editor" id="code-editor" readonly spellcheck="false" aria-label="Extract H1 code"></textarea></div>
      <footer class="dialog-foot"><span id="mode-label">View mode</span><span>Esc to close</span></footer>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script id="extract-h1-source" type="text/plain">
(async function () {
  "use strict";

  var PANEL_ID = "universal-h1-extractor";
  var STYLE_ID = "universal-h1-extractor-style";
  var oldPanel = document.getElementById(PANEL_ID);
  var oldStyle = document.getElementById(STYLE_ID);
  if (oldPanel) oldPanel.remove();
  if (oldStyle) oldStyle.remove();

  var panel = document.createElement("div");
  panel.id = PANEL_ID;
  panel.innerHTML = `
    <div class="extractor-header"><strong>Universal H1 and Title Extractor</strong><button id="extractor-close" title="Close">X</button></div>
    <label for="extractor-input">Paste URLs or anchor-tag HTML:</label>
    <textarea id="extractor-input" placeholder="Paste any HTTP or HTTPS URLs here..."></textarea>
    <div class="extractor-settings">
      <label for="extractor-workers">Workers:</label>
      <select id="extractor-workers">
        <option value="1" selected>1 worker</option><option value="2">2 workers</option><option value="3">3 workers</option><option value="5">5 workers</option><option value="10">10 workers</option><option value="15">15 workers</option><option value="20">20 workers</option><option value="25">25 workers</option><option value="30">30 workers</option><option value="40">40 workers</option><option value="50">50 workers</option>
      </select>
      <label class="extractor-checkbox"><input id="extractor-include-url" type="checkbox" checked> Include URL</label>
      <button id="extractor-start">Start</button><button id="extractor-stop" disabled>Stop</button>
    </div>
    <div class="extractor-progress-container"><div id="extractor-progress-bar"></div><span id="extractor-progress-text">0%</span></div>
    <div id="extractor-status">Waiting for input</div>
    <textarea id="extractor-results" placeholder="Input URL, final URL, title, H1, HTTP status, and errors will appear here..." readonly></textarea>
    <div class="extractor-actions"><button id="extractor-copy" disabled>Copy Results</button><button id="extractor-download" disabled>Download CSV</button><button id="extractor-clear">Clear</button></div>`;
  document.body.appendChild(panel);

  var style = document.createElement("style");
  style.id = STYLE_ID;
  style.textContent = `
    #${PANEL_ID}{position:fixed;top:20px;right:20px;width:580px;max-width:calc(100vw - 40px);max-height:calc(100vh - 40px);overflow-y:auto;z-index:2147483647;box-sizing:border-box;padding:16px;border:1px solid #bbb;border-radius:10px;background:#fff;color:#222;font-family:Arial,sans-serif;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
    #${PANEL_ID} *{box-sizing:border-box} #${PANEL_ID} .extractor-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:18px}
    #extractor-close{width:30px;height:30px;padding:0!important;border:0!important;border-radius:5px;background:#eee!important;color:#222!important;cursor:pointer;font-weight:bold}
    #extractor-input,#extractor-results{display:block;width:100%;min-height:150px;margin-top:7px;margin-bottom:12px;padding:10px;border:1px solid #aaa;border-radius:6px;background:#fff;color:#222;resize:vertical;font-family:Consolas,monospace;font-size:12px;line-height:1.4}
    #extractor-results{min-height:160px;margin-top:12px;white-space:pre} #${PANEL_ID} .extractor-settings,#${PANEL_ID} .extractor-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    #${PANEL_ID} .extractor-checkbox{display:flex;align-items:center;gap:5px;margin-right:auto} #${PANEL_ID} select,#${PANEL_ID} button{padding:8px 12px;border:1px solid #999;border-radius:5px;background:#f7f7f7;color:#222;cursor:pointer}
    #extractor-start{background:#00838f!important;color:#fff!important;border-color:#00838f!important} #extractor-stop{background:#c62828!important;color:#fff!important;border-color:#c62828!important}
    #${PANEL_ID} button:disabled,#${PANEL_ID} select:disabled,#${PANEL_ID} input:disabled{cursor:not-allowed;opacity:.5}
    #${PANEL_ID} .extractor-progress-container{position:relative;width:100%;height:24px;margin-top:14px;overflow:hidden;border-radius:12px;background:#ddd} #extractor-progress-bar{width:0%;height:100%;background:#00838f;transition:width .2s ease}
    #extractor-progress-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#111;font-weight:bold;font-size:12px} #extractor-status{margin-top:10px;padding:9px;border-radius:5px;background:#f3f3f3;font-size:13px;word-break:break-word}`;
  document.head.appendChild(style);

  var inputElement=document.getElementById("extractor-input"),workersElement=document.getElementById("extractor-workers"),includeUrlElement=document.getElementById("extractor-include-url"),startButton=document.getElementById("extractor-start"),stopButton=document.getElementById("extractor-stop"),copyButton=document.getElementById("extractor-copy"),downloadButton=document.getElementById("extractor-download"),clearButton=document.getElementById("extractor-clear"),closeButton=document.getElementById("extractor-close"),resultsElement=document.getElementById("extractor-results"),progressBar=document.getElementById("extractor-progress-bar"),progressText=document.getElementById("extractor-progress-text"),statusElement=document.getElementById("extractor-status");
  var stopped=false,running=false,finalResults=[],activeControllers=[];
  function decodeHtmlEntities(value){var textarea=document.createElement("textarea");textarea.innerHTML=value;return textarea.value}
  function cleanUrl(url){if(!url)return "";var cleanedUrl=decodeHtmlEntities(url).replace(/^[\s"'(<\[]+/,"").replace(/[\s"')>\]},;]+$/g,"").trim();try{var parsedUrl=new URL(cleanedUrl);if(parsedUrl.protocol!=="http:"&&parsedUrl.protocol!=="https:")return "";parsedUrl.hash="";return parsedUrl.href}catch(error){return ""}}
  function extractUrls(input){var decodedInput=decodeHtmlEntities(input).replace(/<br\s*\/?\s*>/gi,"\n"),foundUrls=[];try{var parsedHtml=new DOMParser().parseFromString(decodedInput,"text/html"),links=parsedHtml.querySelectorAll("a[href]");Array.prototype.forEach.call(links,function(link){var cleanedHref=cleanUrl(link.getAttribute("href"));if(cleanedHref)foundUrls.push(cleanedHref)})}catch(error){console.warn("Could not parse anchor-tag HTML:",error)}var plainUrlMatches=decodedInput.match(/https?:\/\/[^\s<>"']+/gi)||[];plainUrlMatches.forEach(function(url){var cleanedUrl=cleanUrl(url);if(cleanedUrl)foundUrls.push(cleanedUrl)});return foundUrls.filter(function(url,index,array){return array.indexOf(url)===index})}
  function cleanCell(value){if(value===null||value===undefined)return "";return String(value).replace(/\t/g," ").replace(/\r?\n/g," ").replace(/\s+/g," ").trim()}
  function updateProgress(completed,total,success,errors){var percentage=total===0?0:Math.round(completed/total*100);progressBar.style.width=percentage+"%";progressText.textContent=percentage+"%";statusElement.textContent="Completed: "+completed+"/"+total+" | Success: "+success+" | Errors: "+errors}
  function formatResults(results){var includeUrl=includeUrlElement.checked;return results.filter(function(item){return item!==undefined}).map(function(item){var columns=[];if(includeUrl){columns.push(cleanCell(item.inputUrl));columns.push(cleanCell(item.finalUrl))}columns.push(cleanCell(item.title),cleanCell(item.h1),cleanCell(item.status),cleanCell(item.error));return columns.join("\t")}).join("\n")}
  function escapeCsvCell(value){var cleanedValue=cleanCell(value);return cleanedValue.indexOf(",")!==-1||cleanedValue.indexOf('"')!==-1||cleanedValue.indexOf("\n")!==-1?'"'+cleanedValue.replace(/"/g,'""')+'"':cleanedValue}
  function formatCsvResults(results){var rows=[["Input URL","Final URL","Title","H1","HTTP Status","Error"]];results.filter(function(item){return item!==undefined}).forEach(function(item){rows.push([item.inputUrl,item.finalUrl,item.title,item.h1,item.status,item.error])});return rows.map(function(row){return row.map(escapeCsvCell).join(",")}).join("\r\n")}
  function getStatusDescription(response){if(!response)return "";return String(response.status)+(response.statusText?" "+response.statusText:"")}
  async function processUrl(url,index){var controller=new AbortController();activeControllers.push(controller);var timeoutId=setTimeout(function(){controller.abort()},30000);try{var response=await fetch(url,{method:"GET",credentials:"include",redirect:"follow",cache:"no-store",signal:controller.signal,headers:{Accept:"text/html,application/xhtml+xml"}}),contentType=response.headers.get("content-type")||"",html=await response.text(),isHtml=contentType.toLowerCase().indexOf("text/html")!==-1||contentType.toLowerCase().indexOf("application/xhtml+xml")!==-1||/^\s*<!doctype html/i.test(html)||/^\s*<html/i.test(html);if(!isHtml)return{index:index,inputUrl:url,finalUrl:response.url||url,title:"Not an HTML page",h1:"Not an HTML page",status:getStatusDescription(response),error:response.ok?"Content-Type: "+(contentType||"Unknown"):"HTTP error"};var page=new DOMParser().parseFromString(html,"text/html"),titleElement=page.querySelector("title"),titleText=titleElement?titleElement.textContent.replace(/\s+/g," ").trim():"",heading=page.querySelector("h1"),h1Text=heading?heading.textContent.replace(/\s+/g," ").trim():"",errorMessages=[];if(!response.ok)errorMessages.push("HTTP error");if(!titleText)errorMessages.push("Title not found");if(!h1Text)errorMessages.push("H1 not found");return{index:index,inputUrl:url,finalUrl:response.url||url,title:titleText||"Title not found",h1:h1Text||"H1 not found",status:getStatusDescription(response),error:errorMessages.join("; ")}}catch(error){var message="Unknown error";if(error&&error.name==="AbortError")message=stopped?"Request stopped":"Request timed out after 30 seconds";else if(error&&error.message)message=error.message;if(message==="Failed to fetch"||message.indexOf("NetworkError")!==-1)message="Fetch blocked, possibly by CORS, login, CAPTCHA, or network policy";return{index:index,inputUrl:url,finalUrl:"",title:"Request failed",h1:"Request failed",status:"",error:message}}finally{clearTimeout(timeoutId);var controllerIndex=activeControllers.indexOf(controller);if(controllerIndex!==-1)activeControllers.splice(controllerIndex,1)}}
  startButton.addEventListener("click",async function(){if(running)return;var urls=extractUrls(inputElement.value);if(urls.length===0){statusElement.textContent="No valid HTTP or HTTPS URLs found in the input.";return}var workerCount=parseInt(workersElement.value,10);if(isNaN(workerCount)||workerCount<1)workerCount=1;workerCount=Math.min(workerCount,urls.length);stopped=false;running=true;finalResults=new Array(urls.length);activeControllers=[];var nextIndex=0,completed=0,success=0,errors=0;startButton.disabled=true;stopButton.disabled=false;copyButton.disabled=true;downloadButton.disabled=true;inputElement.disabled=true;workersElement.disabled=true;includeUrlElement.disabled=true;resultsElement.value="";updateProgress(0,urls.length,0,0);async function worker(workerNumber){while(!stopped){var currentIndex=nextIndex++;if(currentIndex>=urls.length)break;statusElement.textContent="Worker "+workerNumber+" processing "+(currentIndex+1)+" of "+urls.length;var result=await processUrl(urls[currentIndex],currentIndex);finalResults[currentIndex]=result;completed++;if(result.error==="")success++;else errors++;resultsElement.value=formatResults(finalResults);resultsElement.scrollTop=resultsElement.scrollHeight;updateProgress(completed,urls.length,success,errors)}}var workerTasks=[];for(var i=0;i<workerCount;i++)workerTasks.push(worker(i+1));await Promise.all(workerTasks);running=false;startButton.disabled=false;stopButton.disabled=true;inputElement.disabled=false;workersElement.disabled=false;includeUrlElement.disabled=false;var hasResults=finalResults.some(function(item){return item!==undefined});copyButton.disabled=!hasResults;downloadButton.disabled=!hasResults;if(stopped)statusElement.textContent="Stopped. Completed "+completed+" of "+urls.length+" | Success: "+success+" | Errors: "+errors;else{progressBar.style.width="100%";progressText.textContent="100%";statusElement.textContent="Finished "+urls.length+" URLs | Success: "+success+" | Errors: "+errors;console.table(finalResults)}});
  stopButton.addEventListener("click",function(){stopped=true;stopButton.disabled=true;activeControllers.forEach(function(controller){try{controller.abort()}catch(error){console.warn(error)}});statusElement.textContent="Stopping active requests..."});
  copyButton.addEventListener("click",async function(){var output=formatResults(finalResults);try{await navigator.clipboard.writeText(output);statusElement.textContent="Results copied to clipboard."}catch(error){resultsElement.focus();resultsElement.select();var copied=document.execCommand("copy");statusElement.textContent=copied?"Results selected and copied.":"Copy failed. Select the results manually."}});
  downloadButton.addEventListener("click",function(){var output=formatCsvResults(finalResults),blob=new Blob(["\uFEFF"+output],{type:"text/csv;charset=utf-8"}),downloadUrl=URL.createObjectURL(blob),link=document.createElement("a");link.href=downloadUrl;link.download="universal-h1-title-results.csv";document.body.appendChild(link);link.click();link.remove();setTimeout(function(){URL.revokeObjectURL(downloadUrl)},1000);statusElement.textContent="CSV file downloaded."});
  clearButton.addEventListener("click",function(){if(running)return;inputElement.value="";resultsElement.value="";finalResults=[];progressBar.style.width="0%";progressText.textContent="0%";statusElement.textContent="Waiting for input";copyButton.disabled=true;downloadButton.disabled=true});
  closeButton.addEventListener("click",function(){stopped=true;activeControllers.forEach(function(controller){try{controller.abort()}catch(error){console.warn(error)}});panel.remove();var extractorStyle=document.getElementById(STYLE_ID);if(extractorStyle)extractorStyle.remove()});
})();
  </script>

  <script>
    const modal=document.getElementById('code-modal'),editor=document.getElementById('code-editor'),editButton=document.getElementById('edit-button'),copyButton=document.getElementById('copy-button'),closeButton=document.getElementById('close-button'),modeLabel=document.getElementById('mode-label'),toast=document.getElementById('toast');
    const source=document.getElementById('extract-h1-source').textContent.trim();let toastTimer;
    function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
    function openModal(){editor.value=source;editor.readOnly=true;editButton.textContent='Edit';modeLabel.textContent='View mode';modeLabel.classList.remove('editing');modal.classList.add('open');document.body.style.overflow='hidden';closeButton.focus()}
    function closeModal(){modal.classList.remove('open');document.body.style.overflow='';document.getElementById('open-extract-h1').focus()}
    document.getElementById('open-extract-h1').addEventListener('click',openModal);closeButton.addEventListener('click',closeModal);
    editButton.addEventListener('click',()=>{editor.readOnly=!editor.readOnly;if(editor.readOnly){editButton.textContent='Edit';modeLabel.textContent='View mode';modeLabel.classList.remove('editing');showToast('Editing finished')}else{editButton.textContent='Done';modeLabel.textContent='Editing enabled';modeLabel.classList.add('editing');editor.focus()}});
    copyButton.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(editor.value);showToast('Code copied')}catch(error){editor.focus();editor.select();showToast(document.execCommand('copy')?'Code copied':'Copy failed')}});
    modal.addEventListener('click',event=>{if(event.target===modal)closeModal()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal.classList.contains('open'))closeModal()});
    editor.addEventListener('keydown',event=>{if(event.key==='Tab'&&!editor.readOnly){event.preventDefault();const start=editor.selectionStart,end=editor.selectionEnd;editor.value=editor.value.substring(0,start)+'  '+editor.value.substring(end);editor.selectionStart=editor.selectionEnd=start+2}});
  </script>
</body>
</html>
